<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IronClaw Dashboard — Aug 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#e8e0d5; --card:#ddd5c8; --card-hover:#d5cdbf; --text:#2c2820; --text-secondary:#6b6559; --accent:#9e8f7a; --alert-red:#c0392b; --alert-green:#27ae60; --alert-yellow:#d4a017; --tag-bg:#d5cdbf; --modal-overlay:rgba(44,40,32,0.7); }
body.dark { --bg:#1a1815; --card:#25221e; --card-hover:#2f2b26; --text:#e8e0d5; --text-secondary:#9e9487; --accent:#7a6f60; --tag-bg:#2f2b26; --modal-overlay:rgba(0,0,0,0.7); }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding:24px; transition:background .3s,color .3s; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--accent); border-radius:3px; }
.wrap { max-width:1400px; margin:0 auto; }
.grid { display:grid; gap:16px; }
@media (min-width:641px) {
.grid { grid-template-columns:repeat(6,1fr); grid-auto-rows:auto; }
.box-core { grid-column:span 4; grid-row:span 2; }
.box-iran { grid-column:span 2; grid-row:span 2; }
.box-brent { grid-column:span 2; }
.box-wti { grid-column:span 2; }
.box-nvda { grid-column:span 2; }
.box-macros { grid-column:span 2; }
.box-gym { grid-column:span 2; }
.box-spr { grid-column:span 2; }
.box-news-iran { grid-column:span 3; }
.box-news-nvda { grid-column:span 3; }
}
@media (max-width:640px) {
.grid { grid-template-columns:1fr; }
body { padding:12px; }
}
.block { background:var(--card); padding:24px; cursor:pointer; transition:background .2s,transform .15s; position:relative; display:flex; flex-direction:column; }
.block:hover { background:var(--card-hover); }
.block:active { transform:scale(.99); }
.block-title { font-family:'Anton',sans-serif; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--text-secondary); margin-bottom:16px; display:flex; align-items:center; gap:10px; }
.block-title i { color:#9e8f7a; width:18px; text-align:center; }
.block-content { flex:1; display:flex; flex-direction:column; }
.big-number { font-family:'Anton',sans-serif; font-size:52px; line-height:1; text-transform:uppercase; letter-spacing:1px; }
.big-number.green { color:var(--alert-green); }
.big-number.red { color:var(--alert-red); }
.big-number.yellow { color:var(--alert-yellow); }
.label-sm { font-family:'Inter',sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text-secondary); margin-top:4px; }
.tag { display:inline-block; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; background:var(--tag-bg); padding:3px 8px; color:var(--text-secondary); margin-top:6px; }
.change-up { color:var(--alert-green); }
.change-down { color:var(--alert-red); }
.stat-row { display:flex; justify-content:space-between; align-items:flex-end; padding:8px 0; border-bottom:1px solid var(--accent); opacity:.4; }
.stat-row:last-child { border-bottom:none; }
.stat-row .stat-label { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-secondary); }
.stat-row .stat-value { font-family:'Anton',sans-serif; font-size:18px; }
.news-list { flex:1; overflow-y:auto; max-height:220px; }
.news-list .news-item { padding:8px 0; border-bottom:1px solid var(--accent); opacity:.4; }
.news-list .news-item:last-child { border-bottom:none; }
.news-list .news-item .news-title { font-size:13px; line-height:1.3; color:var(--text); }
.news-list .news-item .news-meta { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-secondary); margin-top:3px; }
.spr-bar-bg { width:100%; height:16px; background:var(--tag-bg); margin-top:10px; overflow:hidden; }
.spr-bar-fill { height:100%; background:var(--alert-yellow); transition:width 1s ease; }
.macro-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px; }
.macro-item { text-align:center; padding:8px; background:var(--tag-bg); }
.macro-item .macro-value { font-family:'Anton',sans-serif; font-size:32px; line-height:1; }
.macro-item .macro-label { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--text-secondary); margin-top:2px; }
.gym-exercise { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--accent); opacity:.4; font-size:12px; line-height:1.3; }
.gym-exercise:last-child { border-bottom:none; }
.gym-exercise .gym-name { color:var(--text); }
.gym-exercise .gym-done { color:var(--text-secondary); font-family:'Anton',sans-serif; font-size:14px; letter-spacing:1px; }
.gym-exercise .gym-next { color:var(--alert-green); font-size:10px; letter-spacing:1px; text-transform:uppercase; }
.gym-header { font-family:'Anton',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--alert-yellow); margin:6px 0 2px 0; }
.gym-section { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
.gym-section .tag { font-size:9px; padding:2px 6px; }
.core-animation { flex:1; display:flex; align-items:center; justify-content:center; gap:20px; position:relative; min-height:120px; }
.core-icon-ring { position:relative; width:80px; height:80px; }
.core-icon-ring i { position:absolute; font-size:20px; color:var(--accent); animation:orbit 6s linear infinite; }
.core-icon-ring i:nth-child(1) { top:50%; left:50%; transform:translate(-50%,-50%); font-size:28px; animation:none; }
.core-icon-ring i:nth-child(2) { top:0; left:50%; transform:translateX(-50%); animation-delay:0s; }
.core-icon-ring i:nth-child(3) { top:50%; right:0; transform:translateY(-50%); animation-delay:1.5s; }
.core-icon-ring i:nth-child(4) { bottom:0; left:50%; transform:translateX(-50%); animation-delay:3s; }
.core-icon-ring i:nth-child(5) { top:50%; left:0; transform:translateY(-50%); animation-delay:4.5s; }
@keyframes orbit { 0% { opacity:.2; } 50% { opacity:1; } 100% { opacity:.2; } }
.core-pulse { display:flex; gap:6px; align-items:center; }
.core-pulse .dot { width:8px; height:8px; background:var(--alert-green); border-radius:50%; animation:pulse-dot 1.5s ease-in-out infinite; }
.core-pulse .dot:nth-child(2) { animation-delay:.3s; }
.core-pulse .dot:nth-child(3) { animation-delay:.6s; }
.core-pulse-text { font-family:'Anton',sans-serif; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--text-secondary); margin-left:8px; }
@keyframes pulse-dot { 0%,100% { opacity:.2; transform:scale(.8); } 50% { opacity:1; transform:scale(1.2); } }
.block .last-updated { position:absolute; bottom:8px; right:12px; font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--text-secondary); opacity:0; transition:opacity .2s; }
.block:hover .last-updated { opacity:.6; }
.modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:var(--modal-overlay); z-index:1000; justify-content:center; align-items:center; padding:40px; }
.modal.active { display:flex; }
.modal-content { background:var(--card); padding:40px; max-width:700px; width:100%; max-height:80vh; overflow-y:auto; position:relative; }
.modal-close { position:absolute; top:16px; right:20px; font-size:24px; cursor:pointer; color:var(--text-secondary); border:none; background:none; font-family:'Inter',sans-serif; }
.modal-close:hover { color:var(--text); }
.modal-content h2 { font-family:'Anton',sans-serif; font-size:28px; letter-spacing:2px; text-transform:uppercase; margin-bottom:20px; }
.modal-content p { font-size:14px; line-height:1.6; color:var(--text-secondary); margin-bottom:12px; }
.modal-content a { color:var(--text); text-decoration:underline; text-underline-offset:2px; }
.modal-content a:hover { opacity:.7; }
</style>
</head>
<body>
<div class="wrap">
<div class="grid" id="dgrid"></div>
</div>
<div class="modal" id="modal"><div class="modal-content"><button class="modal-close" onclick="closeModal()">&#10005;</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
(function(){const h=new Date().toLocaleString('en-US',{hour:'2-digit',hour12:false,timeZone:'America/Sao_Paulo'});const hour=parseInt(h);if(hour>=18||hour<6)document.body.classList.add('dark');})();
const NOW=new Date();const UPDATED_STR=NOW.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
const newsData=[{title:"US Official: Iran-Oman Hormuz Deal Expected 'Soon' — Framework Finalized",desc:"Reuters: US expects deal soon between Iran and Oman on Strait of Hormuz",date:"Aug 7-8"},{title:"Iran Seeks to Bar US, Israeli Ships Under Proposed Hormuz Deal",desc:"Bloomberg: Iran demands compensation from hostile countries for passage",date:"Aug 7"},{title:"Brent $82.15 (-0.41%) — Oil Holds Near $82 on Diplomatic Hopes",desc:"Prev $82.49; Oct futures $80.28; Hormuz risk premium compressing",date:"Aug 7"},{title:"WTI ~$77.08 (-0.27%) — Range $77-$78 as Peace Hopes Weigh",desc:"Prev close $77.29; crude at crossroads between war fear and peace hope",date:"Aug 7"},{title:"Houthis Claim Attack on Saudi Tanker Near Bab el-Mandeb",desc:"Red Sea disruption persists as Hormuz diplomacy advances",date:"Aug 5-7"},{title:"SPR at 304.8M bbl — 42.7% of Capacity — Lowest Since Feb 1983",desc:"DOE released 170M+ bbl via exchanges; GAO warns 25% unavailable",date:"Jul 31-Aug 7"},{title:"NVDA ~$221.22 (+1.02%) — Edges Higher After Five-Day Rally Ends",desc:"Aug 7 range $219.36-$221.67; Mkt cap ~$5.37T; Earnings Aug 26",date:"Aug 7"},{title:"37 Analysts Rate NVDA Strong Buy — Consensus PT $314 Ahead of Aug 26",desc:"Goldman says 21.7x forward PE 'compelling'; Data Center booming",date:"Aug 5-8"}];
const nvdaNews=[{title:"NVDA $221.22 (+1.02%) — Range $219.36-$221.67 Aug 7",src:"Robinhood/Investing.com"},{title:"Nvidia Stock Slips After Five-Day Rally — What's Going On?",src:"Invezz/Aug 7"},{title:"Nvidia FY26 Revenue $215.94B (+65.47%) — Data Center Growth Accelerating",src:"Yahoo Finance"},{title:"Analysts Consensus PT ~$314 (+48%) Ahead of Aug 26 Earnings",src:"Vantage Markets/37 analysts"},{title:"Antipodes Partners Boosts Nvidia Stake with 222,759 Shares",src:"TipRanks/Aug 6"},{title:"White House Plans to Keep AI Framework Private — Positive for Chip Sector",src:"Axios/TipRanks"},{title:"Anthropic Building In-House Chip Design Team for Claude",src:"TipRanks/Aug 7"}];
const blocks=[{g:"box-core",id:"core",icon:"fa-microchip",title:"CORE SYSTEM",content:'<div class="core-animation"><div class="core-icon-ring"><i class="fas fa-shield-halved"></i><i class="fas fa-oil-can"></i><i class="fas fa-microchip"></i><i class="fas fa-robot"></i><i class="fas fa-ship"></i></div><div class="core-pulse"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span class="core-pulse-text">Hormuz Deal Framework Finalized</span></div></div><div style="font-size:13px;line-height:1.6;color:var(--text-secondary);margin-top:8px;">Fri Aug 7 — US official says Iran-Oman Hormuz deal expected "soon". Framework finalized. Iran seeks bar on US/Israeli ships. Trump says deal "today or tomorrow"; Tehran calls it "theater diplomacy". Houthis attacked Saudi tanker. Brent $82.15 (-0.41%) · WTI $77.08 (-0.27%) · NVDA $221.22 (+1.02%). SPR 304.8M bbl — 42.7% capacity.</div>',modal:{title:"CORE SYSTEM",body:"<p><strong>Friday Aug 7</strong> — A senior US official told Reuters that Washington expects an agreement between Iran and Oman on the Strait of Hormuz to be reached 'soon.' The draft framework is finalized — Iran and Oman have agreed on coordinates for new shipping routes through the strait, with inbound traffic controlled by Iran and outbound by Oman. The deal awaits final approval from Iran's Supreme Leader Ayatollah Mojtaba Khamenei. Trump says reopening 'could come today or tomorrow,' but Iran's parliament speaker accused Trump of 'theater diplomacy' and denies direct US negotiations — talks are through Oman. A Bloomberg report says Iran will seek to bar US and Israeli ships from the strait under the proposed deal.</p><p><strong>Oil:</strong> Brent $82.15 (-0.41%) · WTI $77.08 (-0.27%). Oil prices remain capped by diplomatic optimism but supported by Houthi Red Sea threats. Brent up 5.30% over the past month, 23.37% YoY.</p><p><strong>NVDA:</strong> $221.22 (+1.02%). Prev close $218.99. Market cap ~$5.37T. Earnings Aug 26. Institutional buying continues — Antipodes Partners boosted stake by 222,759 shares. Consensus PT $314 (+48%).</p><p><strong>SPR:</strong> 304.8M bbl — lowest since Feb 1983. 42.7% of 714M capacity. GAO reports 25% of inventory unavailable for drawdown. DOE released 170M+ bbl via exchanges through summer.</p>"}},{g:"box-iran",id:"iran",icon:"fa-explosion",title:"IRAN CONFLICT",content:'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;"><span class="tag" style="background:var(--alert-green);color:#1a1815;">DEAL FRAMEWORK DONE</span><span class="tag" style="background:var(--alert-yellow);color:#1a1815;">AWAITS KHAMENEI</span></div><div class="stat-row"><span class="stat-label">Hormuz Deal</span><span class="stat-value">Framework finalized</span></div><div class="stat-row"><span class="stat-label">Status</span><span class="stat-value">Awaits Khamenei OK</span></div><div class="stat-row"><span class="stat-label">US Official</span><span class="stat-value">"Expected soon"</span></div><div class="stat-row"><span class="stat-label">Tehran</span><span class="stat-value">"Theater diplomacy"</span></div><div class="stat-row"><span class="stat-label">Houthis</span><span class="stat-value">Attacked Saudi tanker</span></div><div class="stat-row"><span class="stat-label">Iran Demand</span><span class="stat-value">Bar US/Israeli ships</span></div>',modal:{title:"IRAN CONFLICT",body:"<p><strong>Friday Aug 7</strong> — US official tells Reuters: 'We expect a deal soon between Iran and Oman on the Strait of Hormuz.' Iran and Oman have finalized the draft framework, agreeing on coordinates for new shipping routes. The deal awaits final approval from Supreme Leader Ayatollah Mojtaba Khamenei. Trump says reopening 'could come today or tomorrow,' but Iran's parliament speaker accused Trump of 'theater diplomacy' — Oman is mediating, not direct US talks.</p><p><strong>Bloomberg reports:</strong> Iran will seek to bar US and Israeli ships from the Strait of Hormuz and require compensation from hostile countries before they're allowed passage. The emerging deal reportedly recognizes Iran's authority over the strait — 'the concession has already been made,' one source said. Houthis claimed an attack on a Saudi oil tanker near Bab el-Mandeb. Qatari mediators also report progress. US naval blockade of Iran remains in effect.</p>"}},{g:"box-brent",id:"brent",icon:"fa-oil-can",title:"BRENT CRUDE",content:'<div class="big-number green">$82.15</div><div class="label-sm">Brent / bbl</div><div style="margin-top:6px;"><span class="change-down" style="font-family:\'Anton\',sans-serif;font-size:22px;">-0.41%</span></div><div style="margin-top:auto;padding-top:8px;"><div class="stat-row"><span class="stat-label">Prev Close</span><span class="stat-value">$82.49</span></div><div class="stat-row"><span class="stat-label">1-mth Change</span><span class="stat-value change-down">+5.30%</span></div><div class="stat-row"><span class="stat-label">52-wk High</span><span class="stat-value">$126.41</span></div></div>',modal:{title:"BRENT",body:"<p><strong>Brent $82.15 (-0.41%)</strong> — Edged lower on Hormuz deal optimism. Prev close $82.49. Down sharply from $87.93 on Aug 3 and from recent 2026 highs above $120. Up 5.30% over the past month and 23.37% YoY. 52-week range $58.72-$126.41. EIA forecasts Brent avg $74 for 3Q26. Oct 2026 futures ~$80.28. Hormuz risk premium compressing as deal nears finalization, but Houthi Red Sea attacks and Bab el-Mandeb disruption remain wildcards supporting prices. EIA STEO: Brent $85 avg in June, down $22 from May.</p>"}},{g:"box-wti",id:"wti",icon:"fa-gas-pump",title:"WTI CRUDE",content:'<div class="big-number green">$77.08</div><div class="label-sm">WTI / bbl</div><div style="margin-top:6px;"><span class="change-down" style="font-family:\'Anton\',sans-serif;font-size:22px;">-0.27%</span></div><div style="margin-top:auto;padding-top:8px;"><div class="stat-row"><span class="stat-label">Prev Close</span><span class="stat-value">$77.29</span></div><div class="stat-row"><span class="stat-label">1-mth Change</span><span class="stat-value change-down">+4.84%</span></div><div class="stat-row"><span class="stat-label">Retail Gas</span><span class="stat-value">~$3.85</span></div></div>',modal:{title:"WTI",body:"<p><strong>WTI ~$77.08 (-0.27%)</strong> — Range $77-$78. Prev close $77.29. Aug 6 saw a +3.37% bounce after Hormuz deal headlines. Up 4.84% over the past month and 20.66% YoY. 52-week high $119.47 (Mar 2026), low $54.97 (Dec 2025). Retail gas ~$3.85/gal. Saudi Aramco cut flagship crude price for Asian buyers. WTI has retraced sharply from post-war highs near $93 and now hovers around $77. Hormuz diplomacy 'puts the bulls to the test,' per analysts. Geopolitical risk premium shrinking on Hormuz optimism but Red Sea risks persist.</p>"}},{g:"box-nvda",id:"nvda",icon:"fa-microchip",title:"NVDA",content:'<div class="big-number green">$221.22</div><div class="label-sm">NASDAQ</div><div style="margin-top:6px;"><span class="change-up" style="font-family:\'Anton\',sans-serif;font-size:22px;">+1.02%</span></div><div style="margin-top:auto;padding-top:8px;"><div class="stat-row"><span class="stat-label">Aug 6 Close</span><span class="stat-value">$218.99</span></div><div class="stat-row"><span class="stat-label">Consensus PT</span><span class="stat-value change-down">$314 (+48%)</span></div></div>',modal:{title:"NVDA",body:"<p><strong>NVDA $221.22 (+1.02%)</strong> — Rebounded from Aug 6 close of $218.99. Aug 7 range $219.36-$221.67. Ended five-day win streak but recovered. Market cap ~$5.37T, P/E ~34. 52-week range $164.07-$236.54. FY26 revenue $215.94B (+65.47% YoY). Consensus analyst PT ~$314 (+48%) ahead of Aug 26 earnings. 37 analysts rate Strong Buy. Goldman: 21.7x forward PE 'compelling.' Institutional buying continues — Antipodes Partners boosted stake by 222,759 shares. White House plans to keep AI framework private (Axios), positive for chip sector. Anthropic building in-house chip design team for Claude (TipRanks). Data Center segment remains primary growth driver.</p>"}},{g:"box-macros",id:"macros",icon:"fa-chart-line",title:"DAILY MACROS",content:'<div class="macro-grid"><div class="macro-item"><div class="macro-value green">203</div><div class="macro-label">Protein</div></div><div class="macro-item"><div class="macro-value yellow">87</div><div class="macro-label">Carbs</div></div><div class="macro-item"><div class="macro-value yellow">62</div><div class="macro-label">Fat</div></div><div class="macro-item"><div class="macro-value green">1,847</div><div class="macro-label">Cals</div></div></div>',modal:{title:"MACROS",body:"<p>Protein 203g · Carbs 87g · Fat 62g · Calories 1,847</p>"}},{g:"box-gym",id:"gym",icon:"fa-dumbbell",title:"BRUTE LOG",content:'<div class="gym-section"><span class="tag" style="background:var(--alert-green);color:#1a1815;">PUSH DAY</span></div><div class="gym-exercise"><span class="gym-name">Bench Press</span><span class="gym-done">4x8</span></div><div class="gym-exercise"><span class="gym-name">OHP</span><span class="gym-done">4x10</span></div><div class="gym-exercise"><span class="gym-name">Lat Raise</span><span class="gym-done">3x15</span></div><div class="gym-header">NEXT: PULL DAY</div>',modal:{title:"GYM",body:"<p>Push Day done. Bench 4x8 · OHP 4x10 · Lat Raise 3x15</p>"}},{g:"box-spr",id:"spr",icon:"fa-oil-can",title:"SPR ALERT",content:'<div class="big-number yellow">304.8M</div><div class="label-sm">Strategic Petroleum Reserve</div><div class="spr-bar-bg"><div class="spr-bar-fill" style="width:42.7%;"></div></div><div style="margin-top:4px;font-size:10px;color:var(--alert-red);letter-spacing:1px;text-transform:uppercase;">Feb 1983 low · GAO: 25% unavailable · DOE: 170M+ bbl exchanged</div>',modal:{title:"SPR",body:"<p><strong>US SPR:</strong> 304.8M bbl — lowest since February 1983 (42.7% of 714M cap). GAO warns 25% of inventory unavailable for drawdown due to infrastructure and cavern integrity issues. DOE has released over 170M barrels through exchange programs from April-August 2026. Weekly drawdown -5.5M bbl. ~150M bbl needed for operational cavern integrity. Congress mandates minimum 252.4M bbl but president can go below in emergency. Total US crude inventories (commercial + SPR) fell to 730.8M, lowest since 1984.</p><p><strong>China:</strong> ~1,400M bbl strategic reserve (estimated)</p><p><strong>Japan:</strong> ~263M bbl (188 days of import cover)</p>"}},{g:"box-news-iran",id:"iran-news",icon:"fa-newspaper",title:"IRAN NEWS",content:'<div class="news-list" id="iranNewsList"></div>',modal:{title:"NEWS",body:"<p>Iran & Energy News Feed</p>"}},{g:"box-news-nvda",id:"nvda-news",icon:"fa-chart-bar",title:"AI &amp; NVDA NEWS",content:'<div class="news-list" id="nvdaNewsList"></div>',modal:{title:"NVDA NEWS",body:"<p>AI & NVDA News Feed</p>"}}];
blocks.forEach((b,i)=>{const d=document.createElement('div');d.className='block'+(b.g?' '+b.g:'');d.dataset.index=i;d.innerHTML='<div class=\"block-title\"><i class=\"fas '+b.icon+'\"></i> '+b.title+'</div><div class=\"block-content\">'+b.content+'</div><div class=\"last-updated\">'+UPDATED_STR+' BRT</div>';d.addEventListener('click',()=>openModal(b.modal.title,b.modal.body,b.id));document.getElementById('dgrid').appendChild(d);});
function renderNews(id,items,n){const e=document.getElementById(id);if(!e)return;e.innerHTML='';items.slice(0,n||5).forEach(i=>{const d=document.createElement('div');d.className='news-item';d.innerHTML='<div class=\"news-title\">'+i.title+'</div><div class=\"news-meta\">'+(i.date||i.src||'')+'</div>';e.appendChild(d);});}
renderNews('iranNewsList',newsData,5);renderNews('nvdaNewsList',nvdaNews,5);
function openModal(t,b,s){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').classList.add('active');document.body.style.overflow='hidden';}
function closeModal(){document.getElementById('modal').classList.remove('active');document.body.style.overflow='';}
document.getElementById('modal').addEventListener('click',(e)=>{if(e.target===document.getElementById('modal'))closeModal();});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape')closeModal();});
</script>
</body>
</html>
