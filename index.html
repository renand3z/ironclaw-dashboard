<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core System Dashboard — Jul 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #e8e0d5;
    --card: #ddd5c8;
    --card-hover: #d5cdbf;
    --text: #2c2820;
    --text-secondary: #6b6559;
    --accent: #9e8f7a;
    --alert-red: #c0392b;
    --alert-green: #27ae60;
    --alert-yellow: #d4a017;
    --tag-bg: #d5cdbf;
    --modal-overlay: rgba(44,40,32,0.7);
  }
  body.dark {
    --bg: #1a1815;
    --card: #25221e;
    --card-hover: #2f2b26;
    --text: #e8e0d5;
    --text-secondary: #9e9487;
    --accent: #7a6f60;
    --tag-bg: #2f2b26;
    --modal-overlay: rgba(0,0,0,0.7);
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    transition: background 0.3s, color 0.3s;
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    max-width: 1600px;
    margin: 0 auto;
  }
  .block {
    background: var(--card);
    padding: 24px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 200px;
  }
  .block:hover { background: var(--card-hover); }
  .block:active { transform: scale(0.99); }
  .block-title {
    font-family: 'Anton', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .block-title i {
    color: #9e8f7a;
    width: 18px;
    text-align: center;
  }
  .block-content {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .big-number {
    font-family: 'Anton', sans-serif;
    font-size: 52px;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .big-number.green { color: var(--alert-green); }
  .big-number.red { color: var(--alert-red); }
  .big-number.yellow { color: var(--alert-yellow); }
  .label-sm {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: var(--tag-bg);
    padding: 3px 8px;
    color: var(--text-secondary);
    margin-top: 6px;
  }
  .change-up { color: var(--alert-green); }
  .change-down { color: var(--alert-red); }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 8px 0;
    border-bottom: 1px solid var(--accent);
    opacity: 0.4;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .stat-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .stat-row .stat-value {
    font-family: 'Anton', sans-serif;
    font-size: 18px;
  }
  .news-list {
    flex: 1;
    overflow-y: auto;
    max-height: 260px;
  }
  .news-list .news-item {
    padding: 8px 0;
    border-bottom: 1px solid var(--accent);
    opacity: 0.4;
  }
  .news-list .news-item:last-child { border-bottom: none; }
  .news-list .news-item .news-title {
    font-size: 13px;
    line-height: 1.3;
    color: var(--text);
  }
  .news-list .news-item .news-meta {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-top: 3px;
  }
  .spr-bar-bg {
    width: 100%;
    height: 16px;
    background: var(--tag-bg);
    margin-top: 10px;
    overflow: hidden;
  }
  .spr-bar-fill {
    height: 100%;
    background: var(--alert-yellow);
    transition: width 1s ease;
  }
  .macro-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 6px;
  }
  .macro-item {
    text-align: center;
    padding: 8px;
    background: var(--tag-bg);
  }
  .macro-item .macro-value {
    font-family: 'Anton', sans-serif;
    font-size: 32px;
    line-height: 1;
  }
  .macro-item .macro-label {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .macro-total {
    grid-column: 1/-1;
    text-align: center;
    padding: 10px;
    background: var(--tag-bg);
  }
  .macro-total .macro-value {
    font-family: 'Anton', sans-serif;
    font-size: 38px;
    line-height: 1;
  }
  .macro-total .macro-label {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .gym-exercise {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid var(--accent);
    opacity: 0.4;
    font-size: 12px;
    line-height: 1.3;
  }
  .gym-exercise:last-child { border-bottom: none; }
  .gym-exercise .gym-name { color: var(--text); }
  .gym-exercise .gym-done { color: var(--text-secondary); font-family: 'Anton', sans-serif; font-size: 14px; letter-spacing: 1px; }
  .gym-exercise .gym-next { color: var(--alert-green); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .gym-header {
    font-family: 'Anton', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--alert-yellow);
    margin: 6px 0 2px 0;
  }
  .gym-section {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .gym-section .tag {
    font-size: 9px;
    padding: 2px 6px;
  }
  .core-animation {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    position: relative;
    min-height: 120px;
  }
  .core-icon-ring {
    position: relative;
    width: 80px;
    height: 80px;
  }
  .core-icon-ring i {
    position: absolute;
    font-size: 20px;
    color: var(--accent);
    animation: orbit 6s linear infinite;
  }
  .core-icon-ring i:nth-child(1) { top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 28px; animation: none; }
  .core-icon-ring i:nth-child(2) { top: 0; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
  .core-icon-ring i:nth-child(3) { top: 50%; right: 0; transform: translateY(-50%); animation-delay: 1.5s; }
  .core-icon-ring i:nth-child(4) { bottom: 0; left: 50%; transform: translateX(-50%); animation-delay: 3s; }
  .core-icon-ring i:nth-child(5) { top: 50%; left: 0; transform: translateY(-50%); animation-delay: 4.5s; }
  @keyframes orbit {
    0% { opacity: 0.2; }
    50% { opacity: 1; }
    100% { opacity: 0.2; }
  }
  .core-pulse {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .core-pulse .dot {
    width: 8px;
    height: 8px;
    background: var(--alert-green);
    border-radius: 50%;
    animation: pulse-dot 1.5s ease-in-out infinite;
  }
  .core-pulse .dot:nth-child(2) { animation-delay: 0.3s; }
  .core-pulse .dot:nth-child(3) { animation-delay: 0.6s; }
  .core-pulse-text {
    font-family: 'Anton', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-left: 8px;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  .block .last-updated {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-secondary);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .block:hover .last-updated { opacity: 0.6; }
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--modal-overlay);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 40px;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: var(--card);
    padding: 40px;
    max-width: 700px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 24px;
    cursor: pointer;
    color: var(--text-secondary);
    border: none;
    background: none;
    font-family: 'Inter', sans-serif;
  }
  .modal-close:hover { color: var(--text); }
  .modal-content h2 {
    font-family: 'Anton', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .modal-content p {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-secondary);
    margin-bottom: 12px;
  }
  .modal-content a {
    color: var(--text);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .modal-content a:hover { opacity: 0.7; }
  @media (max-width: 1000px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 12px; }
  }
</style>
</head>
<body>
<div class="grid" id="dashboardGrid"></div>
<div class="modal" id="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>
<script>
(function() {
  const h = new Date().toLocaleString('en-US', {hour:'2-digit', hour12:false, timeZone:'America/Sao_Paulo'});
  const hour = parseInt(h);
  if (hour >= 18 || hour < 6) document.body.classList.add('dark');
})();
const NOW = new Date();
const UPDATED_STR = NOW.toLocaleString('en-US', {
  weekday: 'short', month: 'short', day: 'numeric',
  hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo'
});
const newsData = [
  {title:"U.S.-Saudi Jets Strike Iranian Proxies in Iraq", desc:"Fighting escalates as US widens airstrikes.", link:"https://www.nytimes.com/live/2026/07/29/world/iran-us-strikes-iraq-jordan", date:"Jul 30"},
  {title:"Brent Crude at $88.51 as Geopolitical Premium Holds", desc:"Brent edged higher as US strikes Iran for fifth day.", link:"https://www.investing.com/commodities/brent-oil", date:"Jul 30"},
  {title:"WTI Surges 6.2% to $84.18", desc:"Crude oil rebounded sharply from Monday's lows.", link:"https://www.investing.com/commodities/crude-oil", date:"Jul 30"},
  {title:"US Strikes Iran for Fifth Day", desc:"Pentagon confirmed a fifth wave of airstrikes.", link:"https://www.reuters.com/world/middle-east/us-strikes-iran-fifth-day-2026-07-30/", date:"Jul 30"},
  {title:"Netanyahu-Trump Summit Continues", desc:"Hormuz blockade plans discussed.", link:"https://www.nytimes.com/2026/07/29/world/middleeast/netanyahu-trump-summit-hormuz.html", date:"Jul 30"},
  {title:"NVDA Slides 3.4% Amid Fed Rate Jitters", desc:"NVIDIA shares fell amid AI spending concerns.", link:"https://www.tradingkey.com/news/market-movers/262062321-market-movers-nvda-20260729", date:"Jul 30"},
  {title:"Open Secure AI Alliance Names NVIDIA Founding Partner", desc:"New consortium for open-source AI security.", link:"https://www.reuters.com/technology/open-secure-ai-alliance-2026-07-29/", date:"Jul 29"},
  {title:"US SPR Drops to 311.4M bbl", desc:"43-year low as emergency drawdowns continue.", link:"https://www.cnbc.com/2026/07/28/us-strategic-petroleum-reserve-spr-iran-oil-strait-hormuz.html", date:"Jul 30"},
  {title:"Fed Decision Today", desc:"Oil markets brace for rate impact.", link:"https://finance.yahoo.com/", date:"Jul 30"},
  {title:"ARK Invest Buys 79K NVDA Shares Worth $15.5M", desc:"Cathie Wood's ARK added position amid dip.", link:"https://www.investing.com/equities/nvidia-corp-news", date:"Jul 30"}
];
const nvdaNews = [
  {title:"NVDA Slides 3.42% at $190.67", src:"Bloomberg"},
  {title:"ARK Invest Buys 79K Shares ~$15.5M", src:"Investing.com"},
  {title:"Microsoft Meta Google $1.4T AI Bet", src:"TipRanks"},
  {title:"Open Secure AI Alliance Launched", src:"Reuters"},
  {title:"Circular Financing Concerns", src:"Motley Fool"}
];
const blocks = [
  {id:"core",icon:"fa-microchip",title:"CORE SYSTEM",content:'<div class="core-animation"><div class="core-icon-ring"><i class="fas fa-shield-halved"></i><i class="fas fa-oil-can"></i><i class="fas fa-microchip"></i><i class="fas fa-robot"></i><i class="fas fa-ship"></i></div><div class="core-pulse"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span class="core-pulse-text">Active</span></div></div><div style="margin-top:12px;font-size:12px;line-height:1.5;color:var(--text-secondary);">Thursday, Jul 30 -- US strikes Iran for 5th day; IRGC missiles hit Jordan. Brent $88.51 (+0.5%). WTI $84.18 (+6.2%). NVDA $190.67 (-3.4%). Fed decision today. Netanyahu-Trump summit continues. Hormuz blockade plans discussed.</div>',modal:{title:"CORE SYSTEM OVERVIEW [JUL 30]",body:"<p><strong>Thursday, July 30, 2026</strong> -- The US entered its fifth consecutive day of airstrikes against Iran as the Netanyahu-Trump White House summit continued. The IRGC missile salvo on Jordan Tuesday remains unanswered militarily but has deepened the crisis.</p><p><strong>Oil Markets:</strong> Brent crude at <strong>$88.51/bbl (+0.5%)</strong>, WTI surged <strong>6.2% to $84.18/bbl</strong>.</p><p><strong>NVDA</strong> closed at <strong>$190.67 (-3.42%)</strong>. ARK Invest bought 79K shares. Open Secure AI Alliance launched with NVIDIA as founding partner.</p><p><strong>SPR Alert:</strong> US SPR at 311.4M bbl -- 43-year low.</p>"}},
  {id:"iran",icon:"fa-explosion",title:"IRAN CONFLICT",content:'<div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;"><div><span class="tag" style="background:var(--alert-red);color:#1a1815;">STRIKES DAY 5</span></div><div><span class="tag" style="background:var(--alert-yellow);color:#1a1815;">DIPLOMACY COLLAPSED</span></div></div><div style="flex:1;"><div class="stat-row"><span class="stat-label">US Strikes</span><span class="stat-value" style="font-size:14px;">Day 5 ongoing</span></div><div class="stat-row"><span class="stat-label">IRGC</span><span class="stat-value" style="font-size:14px;">Missile attack on Jordan</span></div><div class="stat-row"><span class="stat-label">Netanyahu-Trump</span><span class="stat-value" style="font-size:14px;">Summit continues</span></div><div class="stat-row"><span class="stat-label">Hormuz</span><span class="stat-value" style="font-size:14px;">Blockade plans discussed</span></div><div class="stat-row"><span class="stat-label">Oman Proposal</span><span class="stat-value" style="font-size:14px;">On hold</span></div><div style="margin-top:8px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--alert-red);">Pentagon confirms Day 5 airstrikes | Fed decision looms</div></div>',modal:{title:"IRAN CONFLICT -- US STRIKES DAY 5",body:"<p><strong>US Airstrikes Enter Day 5:</strong> The Pentagon confirmed a fifth wave of airstrikes against Iranian targets overnight. The campaign follows joint U.S.-Saudi strikes on Iranian proxies in Iraq and the IRGC's ballistic missile attack on Jordan.</p><p><strong>White House Summit:</strong> Israeli PM Netanyahu and President Trump discussed expanded military cooperation and Hormuz blockade contingency plans.</p><p><strong>Oman Proposal:</strong> On hold as hostilities continue.</p>"}}
];
blocks.forEach((b,i)=>{const d=document.createElement('div');d.className='block';d.dataset.index=i;d.innerHTML='<div class="block-title"><i class="fas '+b.icon+'"></i> '+b.title+'</div><div class="block-content">'+b.content+'</div><div class="last-updated">Updated '+UPDATED_STR+' BRT</div>';d.addEventListener('click',()=>openModal(b.modal.title,b.modal.body,b.id));document.getElementById('dashboardGrid').appendChild(d)});
function renderNews(id,items,n){const e=document.getElementById(id);if(!e)return;e.innerHTML='';items.slice(0,n||5).forEach(i=>{const d=document.createElement('div');d.className='news-item';d.innerHTML='<div class="news-title">'+i.title+'</div><div class="news-meta">'+(i.date||i.src||'')+'</div>';e.appendChild(d)})}
renderNews('iranNewsList',newsData,5);renderNews('nvdaNewsList',nvdaNews,5);
function openModal(t,b,s){const m=document.getElementById('modal');document.getElementById('modalTitle').textContent=t;let fb=b;if(s==='iran-news'||s==='nvda-news'){fb='<div style="max-height:50vh;overflow-y:auto;">';const items=s==='iran-news'?newsData:nvdaNews;items.forEach(i=>{fb+='<div style="padding:12px 0;border-bottom:1px solid var(--accent);opacity:0.6;"><div style="font-size:14px;line-height:1.4;">'+i.title+'</div><div style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);margin-top:4px;">'+(i.date||i.src||'')+'</div>'+(i.desc?'<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">'+i.desc+'</div>':'')+'</div>'});fb+='</div>'}document.getElementById('modalBody').innerHTML=fb;m.classList.add('active');document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('modal').classList.remove('active');document.body.style.overflow=''}
document.getElementById('modal').addEventListener('click',(e)=>{if(e.target===document.getElementById('modal'))closeModal()});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape')closeModal()});
</script>
</body>
</html>
