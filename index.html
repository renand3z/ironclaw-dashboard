<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IronClaw Dashboard · Aug 12</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e0d5;--card:#ddd5c8;--card-h:#d5cdbf;--tx:#2c2820;--tx2:#6b6559;--green:#27ae60;--red:#c0392b;--yel:#d4a017;--ov:rgba(44,40,32,.7)}
body.dark{--bg:#1a1815;--card:#25221e;--card-h:#2f2b26;--tx:#e8e0d5;--tx2:#9e9487;--ov:rgba(0,0,0,.7)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);padding:16px}
h1{font-family:'Anton';letter-spacing:3px;font-size:22px;margin-bottom:16px;text-transform:uppercase}
h1 span{color:var(--tx2)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(6,1fr)}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.c{border:0;background:var(--card);padding:20px;cursor:pointer;text-align:left;font-family:'Inter';color:var(--tx);position:relative;display:flex;flex-direction:column;min-height:130px}
.c:hover{background:var(--card-h)}
.c .t{font-family:'Anton';font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--tx2);margin-bottom:10px}
.c .v{font-family:'Anton';font-size:38px;line-height:1}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--yel)}
.c .l{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--tx2);margin-top:6px}
.c .s{display:flex;justify-content:space-between;font-size:11px;border-top:1px solid var(--card-h);padding-top:6px;margin-top:auto;opacity:.8}
.c .s b{font-weight:700}
.c .n{font-size:12px;line-height:1.45;color:var(--tx2);margin-top:8px;flex:1}
.bar{height:12px;background:var(--card-h);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yel)}
.col6{grid-column:span 4}.col2{grid-column:span 2}.col3{grid-column:span 3}
.modal{display:none;position:fixed;inset:0;background:var(--ov);justify-content:center;align-items:center;padding:20px;z-index:10}
.modal.open{display:flex}
.box{background:var(--card);max-width:640px;width:100%;max-height:80vh;overflow:auto;padding:26px}
.box h2{font-family:'Anton';letter-spacing:2px;margin-bottom:12px}
.box p{font-size:13px;line-height:1.55;color:var(--tx2);margin-bottom:10px}
.box b{color:var(--tx)}
.x{float:right;font-size:20px;background:none;border:none;color:var(--tx2);cursor:pointer}
</style>
</head>
<body>
<div class="wrap"><h1>IronClaw <span>· Aug 12 · Total Control?</span></h1><div class="grid" id="g"></div></div>
<div class="modal" id="m"><div class="box" id="mb"></div></div>
<script>
(function(){try{var h=new Date().toLocaleString('en-US',{hour:'2-digit',hour12:false,timeZone:'America/Sao_Paulo'});var ha=parseInt(h);if(ha>=18||ha<6)document.body.classList.add('dark')}catch(e){}})();
var D=[
{t:'CORE',c:'col6',v:'US Claims Total Control',l:'Vela Nova hit · IMO escorts paused',n:'US says it "total controls" Hormuz; Iran refutes. Cargo ship M/V Vela Nova disabled by Hellfire. Brent 88.63, WTI 84.17, NVDA 217.50, SPR 298.7M.',body:'<p><b>Tuesday Aug 12</b> - Trump claims the US is in "total control" of the Strait of Hormuz and the situation with Iran is "going fine"; Tehran refutes the claim and IRGC says the strait stays closed until conditions are met (Al Jazeera). A US Navy MH-60 helicopter fired two Hellfire missiles at the Panama-flagged M/V Vela Nova after it ignored warnings and attempted to break the blockade (CENTCOM). The UN IMO escort operation remains paused.</p><p><b>Key:</b> Iran insists on direct conditions and remains in Oman-only route talks, not with Washington. Shipping data does not support Trump claim that the strait is open (CNN). Crude inventories keep draining as war pressure persists.</p><p><b>Oil:</b> Brent $88.63 (-0.31%) - WTI $84.17 (+4.7% vs Aug 10).</p><p><b>NVDA:</b> $217.50 (-0.02%) on AI financing; earnings Aug 26.</p><p><b>SPR:</b> 298.7M bbl - lowest since 1983. Slated to hit ~243M when releases complete.</p>'},
{t:'IRAN',c:'col2',v:'US "total control"',l:'Vela Nova hit',n:'Iran refutes claim; strait stays closed until conditions met. IMO escort paused.',body:'<p><b>Tue Aug 12</b> - Trump claims the US is in "total control" of the Strait of Hormuz, saying the situation is "going fine" (Al Jazeera/Moneycontrol). CENTCOM says a Navy MH-60 helicopter fired two Hellfire missiles at the Panama-flagged M/V Vela Nova after it ignored warnings, disabling the vessel attempting to break the blockade.</p><p><b>Status:</b> Iran refutes the US control claim; IRGC says the strait remains closed until all conditions are met. Tehran continues Oman-only route talks, not direct talks with Washington. The UN IMO Hormuz escort operation remains paused from last week\'s attack.</p>'},
{t:'BRENT',c:'col2',v:'$88.63',s:'-0.31%',l:'Brent / bbl',n:'Prev close ~$88.91; ~$87 low before recovery; elevated risk premium.',body:'<p><b>Brent ~$88.63 (-0.31%)</b> - Eased slightly Tuesday morning after Pakistan signaled a possible deal, but recovered from an ~$87 low toward $88.70+ (TradingEconomics/CNBC). Prior close ~$88.91. Hormuz blockade keeps a large risk premium in the crude complex; Houthi Red Sea attacks support the floor. US officials warn continued shutdown could push gas and oil prices higher (CNN).</p>'},
{t:'WTI',c:'col2',v:'$84.17',s:'+4.66%',l:'WTI / bbl',n:'vs $80.42 Aug 10; elevated on blockade risk.',body:'<p><b>WTI ~$84.17 (+4.66% vs Aug 10)</b> - Well above Monday\'s $80.42 as supply fears over the Hormuz blockade persist (OilPrice.com/Forbes). Crude sliding between deal optimism and renewed disruption risk. US total crude inventories remain low; SPR drawdowns continue. Retail gas remains elevated on the disruption premium.</p>'},
{t:'NVDA',c:'col2',v:'$217.50',s:'-0.02%',l:'NASDAQ',n:'Slipped on AI financing role; mkt cap $5.37T; earnings Aug 26; PT ~$303.',body:'<p><b>NVDA $217.50 (-0.02%)</b> - Slightly lower Tuesday (Aug 11 session) after reports highlighted Nvidia\'s expanding role financing and investing in the AI infrastructure buildout (StockAnalysis). Day range $216.30-$222.20; +0.25% in after-hours. Market cap ~$5.37T. FY26 revenue $120.07B (+64.75% YoY). Consensus 12-month PT ~$303 (Strong Buy, 61 analysts). Earnings Aug 26.</p>'},
{t:'SPR',c:'col2',v:'298.7M',s:'41.8% cap',l:'Strategic Petroleum Reserve',n:'Lowest since 1983; -6.1M w/w; heading to ~243M on releases.',body:'<p><b>US SPR:</b> 298.7M bbl, lowest since 1983 (41.8% of 714M cap), weekly drawdown -6.1M bbl as Iran-war pressure drains inventory (DOE/CNBC). Trump authorized a 172M bbl release; EIA projects SPR will fall to ~243M bbl when fully executed. DOE has released well over 170M bbl via exchanges since April 2026. GAO flags ~25% unavailable for drawdown.</p><p><b>China:</b> ~1.4B bbl strategic inventory (largest in the world); continued building inventories in 2026 (EIA).</p><p><b>Japan:</b> ~260M bbl government-held reserves (~188+ days import cover); 3rd largest, on alert for possible unilateral release.</p>'},
{t:'MACROS',c:'col2',v:'2,109 kcal',s:'P203 - C87 - F62',l:'Daily targets',n:'Protein 203g - Carbs 87g - Fat 62g - Calories 1,847.',body:'<p>Protein 203g - Carbs 87g - Fat 62g - Calories 1,847</p>'},
{t:'GYM',c:'col2',v:'PUSH DONE',s:'B4x8 O4x10 L3x15',l:'Next: Pull day',n:'Bench 4x8 - OHP 4x10 - Lat Raise 3x15.',body:'<p>Push Day done. Bench 4x8 - OHP 4x10 - Lat Raise 3x15</p>'},
{t:'NEWS - IRAN',c:'col3',v:'',l:'Update',n:'',list:["Trump claims US in 'total control' of Strait of Hormuz; Iran refutes (Al Jazeera, Aug 12)","US Navy Hellfire hits Panama-flagged M/V Vela Nova breaking blockade; ship disabled (CENTCOM)","IRGC: Hormuz stays closed until conditions met; Iran-Only Oman route talks continue","IMO Hormuz escort operation remains paused after cargo vessel attack (Reuters)"],body:'<p>Iran and Energy news feed, Aug 12.</p>'},
{t:'NEWS - NVDA',c:'col3',v:'',l:'Update',n:'',list:["NVDA $217.50 (-0.02%) - slips on AI financing role; range $216.30-$222.20 (Aug 11)","Nvidia, six firms mobilize over $500B for AI infrastructure (Reuters/CNBC)","Chipmaker role financing/investing in AI buildout spooks investors (StockAnalysis)","NVDA mkt cap ~$5.37T; consensus PT ~$303; earnings Aug 26"],body:'<p>AI and NVDA news feed.</p>'}
];
function el(c,html){var d=document.createElement(c);d.innerHTML=html;return d}
var g=document.getElementById('g');
D.forEach(function(o){
 var b=document.createElement('div');b.className='card c '+o.c+'';
 var s='<div class="t">'+o.t+'</div>';
 if(o.v)s+='<div class="v '+(typeof o.s==='string'&&o.s.charAt(0)==='-'?'neg':o.s&&o.s.charAt(0)==='+'?'pos':'')+'">'+o.v+'</div>';
 if(o.s&&o.l)s+='<div class="l">'+o.s+' · '+o.l+'</div>';else if(o.l)s+='<div class="l">'+o.l+'</div>';
 if(o.list){s+='<div style="font-size:12px">';o.list.forEach(function(x){s+='<div style="padding:5px 0;border-bottom:1px solid var(--card-h)">'+x+'</div>'});s+='</div>'}
 else if(o.n)s+='<div class="n">'+o.n+'</div>';
 b.innerHTML=s;
 b.onclick=function(){document.getElementById('mb').innerHTML='<button class="x" onclick="document.getElementById(\'m\').classList.remove(\'open\')">&#10005;</button><h2>'+o.t+'</h2>'+(o.body||'<p>'+o.n+'</p>');document.getElementById('m').classList.add('open')};
 g.appendChild(b);
});
document.getElementById('m').onclick=function(e){if(e.target===this)this.classList.remove('open')};
</script>
</body>
</html>
