<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IronClaw Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#e8e0d5; --card:#ddd5c8; --card-hover:#d5cdbf; --text:#2c2820; --text-secondary:#6b6559; --accent:#9e8f7a; --alert-red:#c0392b; --alert-green:#27ae60; --alert-yellow:#d4a017; --tag-bg:#d5cdbf; --modal-overlay:rgba(44,40,32,0.7); }
body.dark { --bg:#1a1815; --card:#25221e; --card-hover:#2f2b26; --text:#e8e0d5; --text-secondary:#9e9487; --accent:#7a6f60; --tag-bg:#2f2b26; --modal-overlay:rgba(0,0,0,0.7); }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding:20px; transition:background .3s,color .3s; }
.wrap { max-width:1400px; margin:0 auto; }
.grid { display:grid; gap:16px; }
@media (min-width:641px) {
  .grid { grid-template-columns:repeat(6,1fr); }
  .c4r2 { grid-column:span 4; grid-row:span 2; }
  .c2r2 { grid-column:span 2; grid-row:span 2; }
  .c2   { grid-column:span 2; }
  .c3   { grid-column:span 3; }
}
@media (max-width:640px) {
  .grid { grid-template-columns:1fr; }
  body { padding:12px; }
}
.block { background:var(--card); padding:20px; cursor:pointer; transition:background .2s,transform .15s; position:relative; display:flex; flex-direction:column; }
.block:hover { background:var(--card-hover); }
.block:active { transform:scale(.99); }
.block-title { font-family:'Anton',sans-serif; font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--text-secondary); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.block-title i { color:#9e8f7a; width:16px; text-align:center; }
.block-content { flex:1; display:flex; flex-direction:column; }
.big-num { font-family:'Anton',sans-serif; font-size:42px; line-height:1; text-transform:uppercase; letter-spacing:1px; }
.grn { color:var(--alert-green); }
.red { color:var(--alert-red); }
.yel { color:var(--alert-yellow); }
.lbl { font-family:'Inter',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--text-secondary); margin-top:2px; }
.tag { display:inline-block; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; background:var(--tag-bg); padding:2px 6px; color:var(--text-secondary); }
.sr { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--accent); opacity:.5; }
.sr:last-child { border:none; }
.sl { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-secondary); }
.sv { font-family:'Anton',sans-serif; font-size:15px; }
.news-list { flex:1; overflow-y:auto; max-height:200px; }
.ni { padding:6px 0; border-bottom:1px solid var(--accent); opacity:.5; }
.ni:last-child { border:none; }
.nt { font-size:12px; line-height:1.3; }
.nm { font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--text-secondary); margin-top:2px; }
.spr-bar { width:100%; height:12px; background:var(--tag-bg); margin-top:8px; overflow:hidden; }
.spr-fill { height:100%; background:var(--alert-yellow); }
.mg { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
.mi { text-align:center; padding:6px; background:var(--tag-bg); }
.mv { font-family:'Anton',sans-serif; font-size:26px; line-height:1; }
.ml { font-size:8px; letter-spacing:2px; text-transform:uppercase; color:var(--text-secondary); margin-top:1px; }
.ge { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--accent); opacity:.5; font-size:11px; }
.ge:last-child { border:none; }
.gh { font-family:'Anton',sans-serif; font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--alert-yellow); margin:4px 0 1px 0; }
.ca { flex:1; display:flex; align-items:center; justify-content:center; gap:16px; min-height:80px; }
.cr { position:relative; width:60px; height:60px; }
.cr i { position:absolute; font-size:16px; color:var(--accent); }
.cr i:nth-child(1) { top:50%; left:50%; transform:translate(-50%,-50%); font-size:22px; }
.cr i:nth-child(2) { top:0; left:50%; transform:translateX(-50%); }
.cr i:nth-child(3) { top:50%; right:0; transform:translateY(-50%); }
.cr i:nth-child(4) { bottom:0; left:50%; transform:translateX(-50%); }
.cr i:nth-child(5) { top:50%; left:0; transform:translateY(-50%); }
.cpd { display:flex; gap:4px; align-items:center; }
.cpd .d { width:6px; height:6px; background:var(--alert-green); border-radius:50%; }
.cpt { font-family:'Anton',sans-serif; font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--text-secondary); margin-left:6px; }
.lu { position:absolute; bottom:6px; right:10px; font-size:8px; letter-spacing:1px; text-transform:uppercase; color:var(--text-secondary); opacity:0; transition:opacity .2s; }
.block:hover .lu { opacity:.6; }
.modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:var(--modal-overlay); z-index:1000; justify-content:center; align-items:center; padding:20px; }
.modal.active { display:flex; }
.mc { background:var(--card); padding:30px; max-width:600px; width:100%; max-height:80vh; overflow-y:auto; position:relative; }
.mcl { position:absolute; top:12px; right:16px; font-size:20px; cursor:pointer; color:var(--text-secondary); border:none; background:none; font-family:'Inter',sans-serif; }
.mcl:hover { color:var(--text); }
.mc h2 { font-family:'Anton',sans-serif; font-size:22px; letter-spacing:2px; text-transform:uppercase; margin-bottom:16px; }
.mc p { font-size:13px; line-height:1.5; color:var(--text-secondary); margin-bottom:10px; }
</style>
</head>
<body>
<div class="wrap"><div class="grid" id="grid"></div></div>
<div class="modal" id="modal"><div class="mc"><button class="mcl" id="modalCloseBtn">&#10005;</button><h2 id="mt"></h2><div id="mb"></div></div></div>
<script>
(function(){try{var h=new Date().toLocaleString('en-US',{hour:'2-digit',hour12:false,timeZone:'America/Sao_Paulo'});if(parseInt(h)>=18||parseInt(h)<6){document.body.classList.add('dark');}}catch(e){}})();
var ts=new Date().toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
var newsData=[{t:"US-Saudi Jets Strike Iranian Proxies in Iraq",d:"Jul 30"},{t:"Brent $88.51 Geopolitical Premium Holds",d:"Jul 30"},{t:"WTI Surges 6.2% to $84.18",d:"Jul 30"},{t:"US Strikes Iran Fifth Day",d:"Jul 30"},{t:"Netanyahu-Trump Summit: Hormuz Plans",d:"Jul 30"},{t:"SPR 311.4M bbl 43yr Low",d:"Jul 30"},{t:"Fed Decision Today",d:"Jul 30"},{t:"ARK Buys 79K NVDA $15.5M",d:"Jul 30"}];
var nvdaNews=[{t:"NVDA -3.42% at $190.67",s:"Bloomberg"},{t:"ARK Buys 79K shares $15.5M",s:"Investing.com"},{t:"Open Secure AI Alliance Launched",s:"Reuters"},{t:"$1.4T AI Bet Paying Off",s:"TipRanks"},{t:"Circular Financing Risk",s:"Motley Fool"}];
var blocks=[{g:"c4r2",icon:"microchip",title:"CORE SYSTEM",content:'<div class="ca"><div class="cr"><i class="fas fa-shield-halved"></i><i class="fas fa-oil-can"></i><i class="fas fa-microchip"></i><i class="fas fa-robot"></i><i class="fas fa-ship"></i></div><div class="cpd"><div class="d"></div><div class="d"></div><div class="d"></div><span class="cpt">Active</span></div></div><div style="font-size:12px;line-height:1.5;color:var(--text-secondary);margin-top:4px;">Thu Jul 30 &mdash; US strikes Iran day 5. Brent $88.51 (+0.5%) WTI $84.18 (+6.2%) NVDA $190.67 (-3.4%). Fed decision. Netanyahu-Trump summit. SPR 311.4M bbl.</div>',modal:"<p><strong>Thursday Jul 30</strong> &mdash; US entered 5th day of airstrikes against Iran. Netanyahu-Trump summit continues. Joint naval patrols & Hormuz blockade contingency plans discussed.</p><p><strong>Oil:</strong> Brent $88.51 (+0.5%) &middot; WTI $84.18 (+6.2%)</p><p><strong>NVDA:</strong> $190.67 (-3.42%). ARK bought 79K shares.</p><p><strong>SPR:</strong> 311.4M bbl &mdash; 43yr low.</p>"},{g:"c2r2",icon:"explosion",title:"IRAN CONFLICT",content:'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;"><span class="tag" style="background:var(--alert-red);color:#1a1815;">STRIKES DAY 5</span><span class="tag" style="background:var(--alert-yellow);color:#1a1815;">DIPLOMACY COLLAPSED</span></div><div class="sr"><span class="sl">US Strikes</span><span class="sv">Day 5</span></div><div class="sr"><span class="sl">IRGC</span><span class="sv">Jordan attack</span></div><div class="sr"><span class="sl">Summit</span><span class="sv">Trump-Netanyahu</span></div><div class="sr"><span class="sl">Hormuz</span><span class="sv">Blockade plans</span></div><div class="sr"><span class="sl">Oman</span><span class="sv">On hold</span></div>',modal:"<p>Day 5 of US airstrikes. IRGC attack on Jordan. Summit discussed Hormuz blockade. Oman proposal on hold.</p>"},{g:"c2",icon:"oil-can",title:"BRENT CRUDE",content:'<div class="big-num grn">$88.51</div><div class="lbl">Brent / bbl</div><div style="margin-top:4px;"><span style="font-family:Anton,sans-serif;font-size:18px;color:var(--alert-red);">+0.5%</span></div><div style="margin-top:auto;padding-top:6px;"><div class="sr"><span class="sl">Prev Close</span><span class="sv">$88.09</span></div><div class="sr"><span class="sl">Weekly High</span><span class="sv">$102</span></div></div>',modal:"<p>Brent $88.51 +0.5% | Weekly high $102. Geopolitical premium holds.</p>"},{g:"c2",icon:"gas-pump",title:"WTI CRUDE",content:'<div class="big-num grn">$84.18</div><div class="lbl">WTI / bbl</div><div style="margin-top:4px;"><span style="font-family:Anton,sans-serif;font-size:18px;color:var(--alert-green);">+6.2%</span></div><div style="margin-top:auto;padding-top:6px;"><div class="sr"><span class="sl">Prev Close</span><span class="sv">$79.26</span></div><div class="sr"><span class="sl">Retail Gas</span><span class="sv">~$4.00</span></div></div>',modal:"<p>WTI $84.18 +6.2%. Five-session rally resumes. Retail gas near $4.00/gal.</p>"},{g:"c2",icon:"microchip",title:"NVDA",content:'<div class="big-num red">$190.67</div><div class="lbl">NASDAQ</div><div style="margin-top:4px;"><span style="font-family:Anton,sans-serif;font-size:18px;color:var(--alert-red);">-3.42%</span></div><div style="margin-top:auto;padding-top:6px;"><div class="sr"><span class="sl">ARK Buy</span><span class="sv">79K shares</span></div><div class="sr"><span class="sl">Upside</span><span class="sv" style="color:var(--alert-green);">+37%</span></div></div>',modal:"<p>NVDA $190.67 -3.42%. ARK bought 79K shares ($15.5M). Target $302 (+37%).</p>"},{g:"c2",icon:"chart-line",title:"DAILY MACROS",content:'<div class="mg"><div class="mi"><div class="mv grn">203</div><div class="ml">Protein</div></div><div class="mi"><div class="mv yel">87</div><div class="ml">Carbs</div></div><div class="mi"><div class="mv yel">62</div><div class="ml">Fat</div></div><div class="mi"><div class="mv grn">1,847</div><div class="ml">Cals</div></div></div>',modal:"<p>Protein 203g &middot; Carbs 87g &middot; Fat 62g &middot; Calories 1,847</p>"},{g:"c2",icon:"dumbbell",title:"BRUTE LOG",content:'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;"><span class="tag" style="background:var(--alert-green);color:#1a1815;">PUSH DAY</span></div><div class="ge"><span>Bench Press</span><span style="font-family:Anton,sans-serif;">4x8</span></div><div class="ge"><span>OHP</span><span style="font-family:Anton,sans-serif;">4x10</span></div><div class="ge"><span>Lat Raise</span><span style="font-family:Anton,sans-serif;">3x15</span></div><div class="gh">NEXT: PULL DAY</div>',modal:"<p>Push Day done. Bench 4x8 &middot; OHP 4x10 &middot; Lat Raise 3x15</p>"},{g:"c2",icon:"oil-can",title:"SPR ALERT",content:'<div class="big-num yel">311.4M</div><div class="lbl">Strategic Petroleum Reserve</div><div class="spr-bar"><div class="spr-fill" style="width:45%;"></div></div><div style="margin-top:2px;font-size:9px;color:var(--alert-red);letter-spacing:1px;text-transform:uppercase;">43-year low &middot; emergency drawdowns</div>',modal:"<p>US SPR at 311.4M bbl &mdash; 43-year low. Infrastructure at risk.</p>"},{g:"c3",icon:"newspaper",title:"IRAN NEWS",content:'<div class="news-list" id="iranNewsList"></div>',modal:"<p>All Iran news items.</p>"},{g:"c3",icon:"chart-bar",title:"AI &amp; NVDA NEWS",content:'<div class="news-list" id="nvdaNewsList"></div>',modal:"<p>All NVDA news items.</p>"}];
function renderNews(id,items){var e=document.getElementById(id);if(!e)return;var h='';for(var i=0;i<Math.min(items.length,5);i++){h+='<div class="ni"><div class="nt">'+items[i].t+'</div><div class="nm">'+(items[i].d||items[i].s||'')+'</div></div>';}e.innerHTML=h;}
renderNews('iranNewsList',newsData);renderNews('nvdaNewsList',nvdaNews);
var grid=document.getElementById('grid');for(var i=0;i<blocks.length;i++){var b=blocks[i];var d=document.createElement('div');d.className='block'+(b.g?' '+b.g:'');d.innerHTML='<div class="block-title"><i class="fas fa-'+b.icon+'"></i> '+b.title+'</div><div class="block-content">'+b.content+'</div><div class="lu">'+ts+' BRT</div>';d.onclick=function(b){return function(){document.getElementById('mt').textContent=b.title;document.getElementById('mb').innerHTML=b.modal;document.getElementById('modal').classList.add('active');document.body.style.overflow='hidden';};}(b);grid.appendChild(d);}
function closeModal(){document.getElementById('modal').classList.remove('active');document.body.style.overflow='';}
document.getElementById('modalCloseBtn').onclick=closeModal;document.getElementById('modal').onclick=function(e){if(e.target===this)closeModal();};document.onkeydown=function(e){if(e.key==='Escape')closeModal();};
</script>
</body>
</html>
