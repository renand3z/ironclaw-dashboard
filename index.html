<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IronClaw Dashboard — Aug 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#e8e0d5; --card:#ddd5c8; --card-hover:#d5cdbf; --text:#2c2820; --text-secondary:#6b6559; --accent:#9e8f7a; --alert-red:#c0392b; --alert-green:#27ae60; --alert-yellow:#d4a017; --tag-bg:#d5cdbf; --modal-overlay:rgba(44,40,32,0.7); }
body.dark { --bg:#1a1815; --card:#25221e; --card-hover:#2f2b26; --text:#e8e0d5; --text-secondary:#9e9487; --accent:#7a6f60; --tag-bg:#2f2b26; --modal-overlay:rgba(0,0,0,0.7); }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding:24px; transition:background .3s,color .3s; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--accent); border-radius:3px; }
.wrap { max-width:1400px; margin:0 auto; }
.grid { display:grid; gap:16px; }
@media (min-width:641px) {
.grid { grid-template-columns:repeat(6,1fr); grid-auto-rows:auto; }
.box-core { grid-column:span 4; grid-row:span 2; }
.box-iran { grid-column:span 2; grid-row:span 2; }
.box-brent { grid-column:span 2; }
.box-wti { grid-column:span 2; }
.box-nvda { grid-column:span 2; }
.box-macros { grid-column:span 2; }
.box-gym { grid-column:span 2; }
.box-spr { grid-column:span 2; }
.box-news-iran { grid-column:span 3; }
.box-news-nvda { grid-column:span 3; }
}
@media (max-width:640px) {
.grid { grid-template-columns:1fr; }
body { padding:12px; }
}
.block { background:var(--card); padding:24px; cursor:pointer; transition:background .2s,transform .15s; position:relative; display:flex; flex-direction:column; }
.block:hover { background:var(--card-hover); }
.block:active { transform:scale(.99); }
.block-title { font-family:'Anton',sans-serif; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--text-secondary); margin-bottom:16px; display:flex; align-items:center; gap:10px; }
.block-title i { color:#9e8f7a; width:18px; text-align:center; }
.block-content { flex:1; display:flex; flex-direction:column; }
.big-number { font-family:'Anton',sans-serif; font-size:52px; line-height:1; text-transform:uppercase; letter-spacing:1px; }
.big-number.green { color:var(--alert-green); }
.big-number.red { color:var(--alert-red); }
.big-number.yellow { color:var(--alert-yellow); }
.label-sm { font-family:'Inter',sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text-secondary); margin-top:4px; }
.tag { display:inline-block; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; background:var(--tag-bg); padding:3px 8px; color:var(--text-secondary); margin-top:6px; }
.change-up { color:var(--alert-green); }
.change-down { color:var(--alert-red); }
.stat-row { display:flex; justify-content:space-between; align-items:flex-end; padding:8px 0; border-bottom:1px solid var(--accent); opacity:.4; }
.stat-row:last-child { border-bottom:none; }
.stat-row .stat-label { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-secondary); }
.stat-row .stat-value { font-family:'Anton',sans-serif; font-size:18px; }
.news-list { flex:1; overflow-y:auto; max-height:220px; }
.news-list .news-item { padding:8px 0; border-bottom:1px solid var(--accent); opacity:.4; }
.news-list .news-item:last-child { border-bottom:none; }
.news-list .news-item .news-title { font-size:13px; line-height:1.3; color:var(--text); }
.news-list .news-item .news-meta { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-secondary); margin-top:3px; }
.spr-bar-bg { width:100%; height:16px; background:var(--tag-bg); margin-top:10px; overflow:hidden; }
.spr-bar-fill { height:100%; background:var(--alert-yellow); transition:width 1s ease; }
.macro-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px; }
.macro-item { text-align:center; padding:8px; background:var(--tag-bg); }
.macro-item .macro-value { font-family:'Anton',sans-serif; font-size:32px; line-height:1; }
.macro-item .macro-label { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--text-secondary); margin-top:2px; }
.gym-exercise { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--accent); opacity:.4; font-size:12px; line-height:1.3; }
.gym-exercise:last-child { border-bottom:none; }
.gym-exercise .gym-name { color:var(--text); }
.gym-exercise .gym-done { color:var(--text-secondary); font-family:'Anton',sans-serif; font-size:14px; letter-spacing:1px; }
.gym-exercise .gym-next { color:var(--alert-green); font-size:10px; letter-spacing:1px; text-transform:uppercase; }
.gym-header { font-family:'Anton',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--alert-yellow); margin:6px 0 2px 0; }
.gym-section { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
.gym-section .tag { font-size:9px; padding:2px 6px; }
.core-animation { flex:1; display:flex; align-items:center; justify-content:center; gap:20px; position:relative; min-height:120px; }
.core-icon-ring { position:relative; width:80px; height:80px; }
.core-icon-ring i { position:absolute; font-size:20px; color:var(--accent); animation:orbit 6s linear infinite; }
.core-icon-ring i:nth-child(1) { top:50%; left:50%; transform:translate(-50%,-50%); font-size:28px; animation:none; }
.core-icon-ring i:nth-child(2) { top:0; left:50%; transform:translateX(-50%); animation-delay:0s; }
.core-icon-ring i:nth-child(3) { top:50%; right:0; transform:translateY(-50%); animation-delay:1.5s; }
.core-icon-ring i:nth-child(4) { bottom:0; left:50%; transform:translateX(-50%); animation-delay:3s; }
.core-icon-ring i:nth-child(5) { top:50%; left:0; transform:translateY(-50%); animation-delay:4.5s; }
@keyframes orbit { 0% { opacity:.2; } 50% { opacity:1; } 100% { opacity:.2; } }
.core-pulse { display:flex; gap:6px; align-items:center; }
.core-pulse .dot { width:8px; height:8px; background:var(--alert-green); border-radius:50%; animation:pulse-dot 1.5s ease-in-out infinite; }
.core-pulse .dot:nth-child(2) { animation-delay:.3s; }
.core-pulse .dot:nth-child(3) { animation-delay:.6s; }
.core-pulse-text { font-family:'Anton',sans-serif; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--text-secondary); margin-left:8px; }
@keyframes pulse-dot { 0%,100% { opacity:.2; transform:scale(.8); } 50% { opacity:1; transform:scale(1.2); } }
.block .last-updated { position:absolute; bottom:8px; right:12px; font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--text-secondary); opacity:0; transition:opacity .2s; }
.block:hover .last-updated { opacity:.6; }
.modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:var(--modal-overlay); z-index:1000; justify-content:center; align-items:center; padding:40px; }
.modal.active { display:flex; }
.modal-content { background:var(--card); padding:40px; max-width:700px; width:100%; max-height:80vh; overflow-y:auto; position:relative; }
.modal-close { position:absolute; top:16px; right:20px; font-size:24px; cursor:pointer; color:var(--text-secondary); border:none; background:none; font-family:'Inter',sans-serif; }
.modal-close:hover { color:var(--text); }
.modal-content h2 { font-family:'Anton',sans-serif; font-size:28px; letter-spacing:2px; text-transform:uppercase; margin-bottom:20px; }
.modal-content p { font-size:14px; line-height:1.6; color:var(--text-secondary); margin-bottom:12px; }
.modal-content a { color:var(--text); text-decoration:underline; text-underline-offset:2px; }
.modal-content a:hover { opacity:.7; }
</style>
</head>
<body>
<div class="wrap">
<div class="grid" id="dgrid"></div>
</div>
<div class="modal" id="modal"><div class="modal-content"><button class="modal-close" onclick="closeModal()">&#10005;</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
(function(){const h=new Date().toLocaleString('en-US',{hour:'2-digit',hour12:false,timeZone:'America/Sao_Paulo'});const hour=parseInt(h);if(hour>=18||hour<6)document.body.classList.add('dark');})();
const NOW=new Date();const UPDATED_STR=NOW.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
const newsData=[{title:"US Plans New Iran Strikes This Weekend",desc:"CENTCOM prepares heavy 2-week bombardment",date:"Aug 1"},{title:"Brent $89.00 — Hormuz Risk Premium Compresses",desc:"Diplomatic hopes cap gains",date:"Aug 1"},{title:"WTI Rises 3.8% to $86.80",desc:"Five-month war underpins supply fears",date:"Aug 1"},{title:"Saudis Form 14-Nation Red Sea Coalition",desc:"Houthi blockade threatens energy routes",date:"Aug 1"},{title:"Oil Tanker Hits Mine in Hormuz",desc:"Iranian media reports explosion",date:"Aug 1"},{title:"SPR Falls to 307.65M bbl — 1983 Low",desc:"GAO warns 25% of inventory unavailable",date:"Aug 1"},{title:"Kuwait Intercepts Drones; Bahrain Hit",desc:"Regional spillover intensifies",date:"Aug 1"},{title:"NVDA Rises 2% to $198.98",desc:"Amazon capex boost lifts semis",date:"Aug 1"}];
const nvdaNews=[{title:"NVDA +2.02% at $198.98 — Amazon capex drives rally",src:"Bloomberg"},{title:"ARK Buys 79K NVDA ~$15.5M on Dip",src:"Investing.com"},{title:"Mark Cuban, Burry Warn AI Boom Relies on Nvidia",src:"Business Insider"},{title:"Goldman: 21.7x PE 'Compelling' After Kyber Delay Denied",src:"TradingKey"},{title:"Polymarket: 50% Chance NVDA Closes Aug Above $240",src:"Finbold"}];
const blocks=[{g:"box-core",id:"core",icon:"fa-microchip",title:"CORE SYSTEM",content:'<div class="core-animation"><div class="core-icon-ring"><i class="fas fa-shield-halved"></i><i class="fas fa-oil-can"></i><i class="fas fa-microchip"></i><i class="fas fa-robot"></i><i class="fas fa-ship"></i></div><div class="core-pulse"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span class="core-pulse-text">Active</span></div></div><div style="font-size:13px;line-height:1.6;color:var(--text-secondary);margin-top:8px;">Saturday Aug 1 — US plans fresh Iran strikes this weekend. Brent $89.00 (-1.06%) · WTI $86.80 (+3.84%) · NVDA $198.98 (+2.02%). Saudi Arabia forms 14-nation Red Sea coalition. Hormuz tanker mine strike. SPR at 307.65M bbl — lowest since 1983.</div>',modal:{title:"CORE SYSTEM",body:"<p><strong>Saturday Aug 1</strong> — The US is preparing a new wave of strikes against Iran as soon as this weekend, with CENTCOM readying options for a heavy 2-week bombardment of Iranian missile sites. Trump said Friday the US will be \"hitting them very hard.\" Kuwait reported drone attacks; Bahrain came under Iranian fire again. An oil tanker hit a mine in the Strait of Hormuz.</p><p>Saudi Arabia formed a 14-nation Multinational Maritime Defense Coalition to protect Red Sea and Bab el-Mandeb shipping from Houthi attacks — Pakistan, Turkey, and Egypt committing naval forces.</p><p><strong>Oil:</strong> Brent $89.00 (-1.06%) · WTI $86.80 (+3.84%)</p><p><strong>NVDA:</strong> $198.98 (+2.02%). Amazon capex boost. ARK bought 79K shares.</p><p><strong>SPR:</strong> 307.65M bbl — lowest since 1983. GAO reports 25% of inventory unavailable for drawdown.</p>"}},{g:"box-iran",id:"iran",icon:"fa-explosion",title:"IRAN CONFLICT",content:'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;"><span class="tag" style="background:var(--alert-red);color:#1a1815;">STRIKES WEEKEND</span><span class="tag" style="background:var(--alert-yellow);color:#1a1815;">RED SEA COALITION</span></div><div class="stat-row"><span class="stat-label">US Strikes</span><span class="stat-value">Weekend planned</span></div><div class="stat-row"><span class="stat-label">IRGC</span><span class="stat-value">Kuwait drones</span></div><div class="stat-row"><span class="stat-label">Saudi Coalition</span><span class="stat-value">14 nations</span></div><div class="stat-row"><span class="stat-label">Hormuz</span><span class="stat-value">Tanker mine strike</span></div><div class="stat-row"><span class="stat-label">Bahrain</span><span class="stat-value">Iranian fire</span></div>',modal:{title:"IRAN CONFLICT",body:"<p>US planning new strikes on Iran as soon as this weekend — CENTCOM prepared for heavy 2-week bombardment. Saudi Arabia launched a 14-nation Multinational Maritime Defense Coalition for Red Sea/Bab el-Mandeb after Houthi blockade. Oil tanker hit mine in Strait of Hormuz. Kuwait intercepted drones; Bahrain under Iranian fire. Trump: 'We will be hitting them very hard.'</p>"}},{g:"box-brent",id:"brent",icon:"fa-oil-can",title:"BRENT CRUDE",content:'<div class="big-number green">$89.00</div><div class="label-sm">Brent / bbl</div><div style="margin-top:6px;"><span class="change-down" style="font-family:\'Anton\',sans-serif;font-size:22px;">-1.06%</span></div><div style="margin-top:auto;padding-top:8px;"><div class="stat-row"><span class="stat-label">Prev Close</span><span class="stat-value">$89.95</span></div><div class="stat-row"><span class="stat-label">Weekly High</span><span class="stat-value">$102</span></div></div>',modal:{title:"BRENT",body:"<p>Brent $89.00 (-1.06%) — Dipped on hopes for diplomatic solution to US-Iran war and increased tanker traffic through Hormuz. Prev close $89.95. Weekly high $102. Saudi Red Sea coalition adds supply-route stability premium.</p>"}},{g:"box-wti",id:"wti",icon:"fa-gas-pump",title:"WTI CRUDE",content:'<div class="big-number green">$86.80</div><div class="label-sm">WTI / bbl</div><div style="margin-top:6px;"><span class="change-up" style="font-family:\'Anton\',sans-serif;font-size:22px;">+3.84%</span></div><div style="margin-top:auto;padding-top:8px;"><div class="stat-row"><span class="stat-label">Prev Close</span><span class="stat-value">$83.59</span></div><div class="stat-row"><span class="stat-label">Retail Gas</span><span class="stat-value">~$4.00</span></div></div>',modal:{title:"WTI",body:"<p>WTI $86.80 (+3.84%) — Surged as upstream FCF generation remains strong. Iran war underpins supply fears. Prev close $83.59. Retail gas ~$4.00/gal. 52-week high $119.47.</p>"}},{g:"box-nvda",id:"nvda",icon:"fa-microchip",title:"NVDA",content:'<div class="big-number green">$198.98</div><div class="label-sm">NASDAQ</div><div style="margin-top:6px;"><span class="change-up" style="font-family:\'Anton\',sans-serif;font-size:22px;">+2.02%</span></div><div style="margin-top:auto;padding-top:8px;"><div class="stat-row"><span class="stat-label">ARK Buy</span><span class="stat-value">79K shares</span></div><div class="stat-row"><span class="stat-label">Consensus Target</span><span class="stat-value change-up">$240 (+21%)</span></div></div>',modal:{title:"NVDA",body:"<p>NVDA $198.98 (+2.02%). Amazon raised capex forecast, boosting semis. ARK Invest bought 79K shares (~$15.5M). Goldman: 21.7x PE 'compelling' after Kyber delay denied. Polymarket: 50% chance NVDA closes Aug above $240. Mark Cuban & Michael Burry warn AI boom dangerously reliant on Nvidia. Next earnings: Aug 26, 2026.</p>"}},{g:"box-macros",id:"macros",icon:"fa-chart-line",title:"DAILY MACROS",content:'<div class="macro-grid"><div class="macro-item"><div class="macro-value green">203</div><div class="macro-label">Protein</div></div><div class="macro-item"><div class="macro-value yellow">87</div><div class="macro-label">Carbs</div></div><div class="macro-item"><div class="macro-value yellow">62</div><div class="macro-label">Fat</div></div><div class="macro-item"><div class="macro-value green">1,847</div><div class="macro-label">Cals</div></div></div>',modal:{title:"MACROS",body:"<p>Protein 203g · Carbs 87g · Fat 62g · Calories 1,847</p>"}},{g:"box-gym",id:"gym",icon:"fa-dumbbell",title:"BRUTE LOG",content:'<div class="gym-section"><span class="tag" style="background:var(--alert-green);color:#1a1815;">PUSH DAY</span></div><div class="gym-exercise"><span class="gym-name">Bench Press</span><span class="gym-done">4x8</span></div><div class="gym-exercise"><span class="gym-name">OHP</span><span class="gym-done">4x10</span></div><div class="gym-exercise"><span class="gym-name">Lat Raise</span><span class="gym-done">3x15</span></div><div class="gym-header">NEXT: PULL DAY</div>',modal:{title:"GYM",body:"<p>Push Day done. Bench 4x8 · OHP 4x10 · Lat Raise 3x15</p>"}},{g:"box-spr",id:"spr",icon:"fa-oil-can",title:"SPR ALERT",content:'<div class="big-number yellow">307.65M</div><div class="label-sm">Strategic Petroleum Reserve</div><div class="spr-bar-bg"><div class="spr-bar-fill" style="width:43.1%;"></div></div><div style="margin-top:4px;font-size:10px;color:var(--alert-red);letter-spacing:1px;text-transform:uppercase;">1983 low · GAO: 25% unavailable</div>',modal:{title:"SPR",body:"<p><strong>US SPR:</strong> 307.65M bbl — lowest since 1983 (43.1% of 714M cap). GAO warns 25% of inventory unavailable for drawdown due to outages. Weekly drawdown: -5.5M bbl.</p><p><strong>China:</strong> ~1,400M bbl strategic reserve</p><p><strong>Japan:</strong> ~263M bbl (188 days of imports)</p>"}},{g:"box-news-iran",id:"iran-news",icon:"fa-newspaper",title:"IRAN NEWS",content:'<div class="news-list" id="iranNewsList"></div>',modal:{title:"NEWS",body:"<p>Iran & Energy News Feed</p>"}},{g:"box-news-nvda",id:"nvda-news",icon:"fa-chart-bar",title:"AI &amp; NVDA NEWS",content:'<div class="news-list" id="nvdaNewsList"></div>',modal:{title:"NVDA NEWS",body:"<p>AI & NVDA News Feed</p>"}}];
blocks.forEach((b,i)=>{const d=document.createElement('div');d.className='block'+(b.g?' '+b.g:'');d.dataset.index=i;d.innerHTML='<div class="block-title"><i class="fas '+b.icon+'"></i> '+b.title+'</div><div class="block-content">'+b.content+'</div><div class="last-updated">'+UPDATED_STR+' BRT</div>';d.addEventListener('click',()=>openModal(b.modal.title,b.modal.body,b.id));document.getElementById('dgrid').appendChild(d);});
function renderNews(id,items,n){const e=document.getElementById(id);if(!e)return;e.innerHTML='';items.slice(0,n||5).forEach(i=>{const d=document.createElement('div');d.className='news-item';d.innerHTML='<div class="news-title">'+i.title+'</div><div class="news-meta">'+(i.date||i.src||'')+'</div>';e.appendChild(d);});}
renderNews('iranNewsList',newsData,5);renderNews('nvdaNewsList',nvdaNews,5);
function openModal(t,b,s){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').classList.add('active');document.body.style.overflow='hidden';}
function closeModal(){document.getElementById('modal').classList.remove('active');document.body.style.overflow='';}
document.getElementById('modal').addEventListener('click',(e)=>{if(e.target===document.getElementById('modal'))closeModal();});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape')closeModal();});
</script>
</body>
</html>
