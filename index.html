<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IronClaw Dashboard — Aug 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#e8e0d5; --card:#ddd5c8; --card-hover:#d5cdbf; --text:#2c2820; --text-secondary:#6b6559; --accent:#9e8f7a; --alert-red:#c0392b; --alert-green:#27ae60; --alert-yellow:#d4a017; --tag-bg:#d5cdbf; --modal-overlay:rgba(44,40,32,0.7); }
body.dark { --bg:#1a1815; --card:#25221e; --card-hover:#2f2b26; --text:#e8e0d5; --text-secondary:#9e9487; --accent:#7a6f60; --tag-bg:#2f2b26; --modal-overlay:rgba(0,0,0,0.7); }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding:24px; transition:background .3s,color .3s; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--accent); border-radius:3px; }
.wrap { max-width:1400px; margin:0 auto; }
.grid { display:grid; gap:16px; }
@media (min-width:641px) {
.grid { grid-template-columns:repeat(6,1fr); grid-auto-rows:auto; }
.box-core { grid-column:span 4; grid-row:span 2; }
.box-iran { grid-column:span 2; grid-row:span 2; }
.box-brent { grid-column:span 2; }
.box-wti { grid-column:span 2; }
.box-nvda { grid-column:span 2; }
.box-macros { grid-column:span 2; }
.box-gym { grid-column:span 2; }
.box-spr { grid-column:span 2; }
.box-news-iran { grid-column:span 3; }
.box-news-nvda { grid-column:span 3; }
}
@media (max-width:640px) {
.grid { grid-template-columns:1fr; }
body { padding:12px; }
}
.block { background:var(--card); padding:24px; cursor:pointer; transition:background .2s,transform .15s; position:relative; display:flex; flex-direction:column; }
.block:hover { background:var(--card-hover); }
.block:active { transform:scale(.99); }
.block-title { font-family:'Anton',sans-serif; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--text-secondary); margin-bottom:16px; display:flex; align-items:center; gap:10px; }
.block-title i { color:#9e8f7a; width:18px; text-align:center; }
.block-content { flex:1; display:flex; flex-direction:column; }
.big-number { font-family:'Anton',sans-serif; font-size:52px; line-height:1; text-transform:uppercase; letter-spacing:1px; }
.big-number.green { color:var(--alert-green); }
.big-number.red { color:var(--alert-red); }
.big-number.yellow { color:var(--alert-yellow); }
.label-sm { font-family:'Inter',sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text-secondary); margin-top:4px; }
.tag { display:inline-block; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; background:var(--tag-bg); padding:3px 8px; color:var(--text-secondary); margin-top:6px; }
.change-up { color:var(--alert-green); }
.change-down { color:var(--alert-red); }
.stat-row { display:flex; justify-content:space-between; align-items:flex-end; padding:8px 0; border-bottom:1px solid var(--accent); opacity:.4; }
.stat-row:last-child { border-bottom:none; }
.stat-row .stat-label { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-secondary); }
.stat-row .stat-value { font-family:'Anton',sans-serif; font-size:18px; }
.news-list { flex:1; overflow-y:auto; max-height:220px; }
.news-list .news-item { padding:8px 0; border-bottom:1px solid var(--accent); opacity:.4; }
.news-list .news-item:last-child { border-bottom:none; }
.news-list .news-item .news-title { font-size:13px; line-height:1.3; color:var(--text); }
.news-list .news-item .news-meta { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-secondary); margin-top:3px; }
.spr-bar-bg { width:100%; height:16px; background:var(--tag-bg); margin-top:10px; overflow:hidden; }
.spr-bar-fill { height:100%; background:var(--alert-yellow); transition:width 1s ease; }
.macro-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px; }
.macro-item { text-align:center; padding:8px; background:var(--tag-bg); }
.macro-item .macro-value { font-family:'Anton',sans-serif; font-size:32px; line-height:1; }
.macro-item .macro-label { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--text-secondary); margin-top:2px; }
.gym-exercise { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--accent); opacity:.4; font-size:12px; line-height:1.3; }
.gym-exercise:last-child { border-bottom:none; }
.gym-exercise .gym-name { color:var(--text); }
.gym-exercise .gym-done { color:var(--text-secondary); font-family:'Anton',sans-serif; font-size:14px; letter-spacing:1px; }
.gym-exercise .gym-next { color:var(--alert-green); font-size:10px; letter-spacing:1px; text-transform:uppercase; }
.gym-header { font-family:'Anton',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--alert-yellow); margin:6px 0 2px 0; }
.gym-section { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
.gym-section .tag { font-size:9px; padding:2px 6px; }
.core-animation { flex:1; display:flex; align-items:center; justify-content:center; gap:20px; position:relative; min-height:120px; }
.core-icon-ring { position:relative; width:80px; height:80px; }
.core-icon-ring i { position:absolute; font-size:20px; color:var(--accent); animation:orbit 6s linear infinite; }
.core-icon-ring i:nth-child(1) { top:50%; left:50%; transform:translate(-50%,-50%); font-size:28px; animation:none; }
.core-icon-ring i:nth-child(2) { top:0; left:50%; transform:translateX(-50%); animation-delay:0s; }
.core-icon-ring i:nth-child(3) { top:50%; right:0; transform:translateY(-50%); animation-delay:1.5s; }
.core-icon-ring i:nth-child(4) { bottom:0; left:50%; transform:translateX(-50%); animation-delay:3s; }
.core-icon-ring i:nth-child(5) { top:50%; left:0; transform:translateY(-50%); animation-delay:4.5s; }
@keyframes orbit { 0% { opacity:.2; } 50% { opacity:1; } 100% { opacity:.2; } }
.core-pulse { display:flex; gap:6px; align-items:center; }
.core-pulse .dot { width:8px; height:8px; background:var(--alert-green); border-radius:50%; animation:pulse-dot 1.5s ease-in-out infinite; }
.core-pulse .dot:nth-child(2) { animation-delay:.3s; }
.core-pulse .dot:nth-child(3) { animation-delay:.6s; }
.core-pulse-text { font-family:'Anton',sans-serif; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--text-secondary); margin-left:8px; }
@keyframes pulse-dot { 0%,100% { opacity:.2; transform:scale(.8); } 50% { opacity:1; transform:scale(1.2); } }
.block .last-updated { position:absolute; bottom:8px; right:12px; font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--text-secondary); opacity:0; transition:opacity .2s; }
.block:hover .last-updated { opacity:.6; }
.modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:var(--modal-overlay); z-index:1000; justify-content:center; align-items:center; padding:40px; }
.modal.active { display:flex; }
.modal-content { background:var(--card); padding:40px; max-width:700px; width:100%; max-height:80vh; overflow-y:auto; position:relative; }
.modal-close { position:absolute; top:16px; right:20px; font-size:24px; cursor:pointer; color:var(--text-secondary); border:none; background:none; font-family:'Inter',sans-serif; }
.modal-close:hover { color:var(--text); }
.modal-content h2 { font-family:'Anton',sans-serif; font-size:28px; letter-spacing:2px; text-transform:uppercase; margin-bottom:20px; }
.modal-content p { font-size:14px; line-height:1.6; color:var(--text-secondary); margin-bottom:12px; }
.modal-content a { color:var(--text); text-decoration:underline; text-underline-offset:2px; }
.modal-content a:hover { opacity:.7; }
</style>
</head>
<body>
<div class="wrap">
<div class="grid" id="dgrid"></div>
</div>
<div class="modal" id="modal"><div class="modal-content"><button class="modal-close" onclick="closeModal()">&#10005;</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
(function(){const h=new Date().toLocaleString('en-US',{hour:'2-digit',hour12:false,timeZone:'America/Sao_Paulo'});const hour=parseInt(h);if(hour>=18||hour<6)document.body.classList.add('dark');})();
const NOW=new Date();const UPDATED_STR=NOW.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
const newsData=[{title:"Trump Halts Weekend Strikes — Talks with Iran Start Monday",desc:"Diplomatic push as CENTCOM stood down",date:"Aug 3"},{title:"Iran Talking to Oman on Hormuz Bypass Route",desc:"No direct US talks, Oman mediating",date:"Aug 3"},{title:"Brent $87.93 (-1.24%) — Diplomatic Hopes Cap Rally",desc:"Prev $89.03; Hormuz tanker traffic rising",date:"Aug 3"},{title:"WTI ~$80.80 (-4.6%) — Risk Premium Unwinds",desc:"Prev close $84.67; forecast $78-$85",date:"Aug 3"},{title:"Saudis Form 14-Nation Red Sea Coalition",desc:"Pakistan, Turkey, Egypt commit naval forces",date:"Aug 3"},{title:"SPR at 307.7M bbl — 1983 Low",desc:"Weekly drawdown -5.5M; GAO 25% unavailable",date:"Aug 3"},{title:"NVDA $198.98 (−0.88%) — Range $194.95-$201.97",desc:"Earnings Aug 26; market cap $4.86T",date:"Aug 3"},{title:"Alibaba Secretly Funneled 20K Nvidia Chips to Power Kimi K3",desc:"China AI surge despite US export crackdown",date:"Aug 3"}];
const nvdaNews=[{title:"NVDA $198.98 — Trading in $194.95-$201.97 range Aug 3",src:"Robinhood"},{title:"Nvidia Revenue $81.6B Q2 FY27, Data Center Booming",src:"Yahoo Finance"},{title:"Market Cap $4.86T; P/E 30.74; Dividend Yield 0.14%",src:"Robinhood"},{title:"Alibaba Secretly Funneled 20K Nvidia Chips for Kimi K3 AI",src:"CNN/TipRanks"},{title:"Earnings Call Aug 26 — Q2 FY27 Results",src:"NVIDIA Newsroom"},{title:"Analysts Consensus: Strong Buy, PT $302",src:"Public.com/37 analysts"}];
const blocks=[{g:"box-core",id:"core",icon:"fa-microchip",title:"CORE SYSTEM",content:'<div class="core-animation"><div class="core-icon-ring"><i class="fas fa-shield-halved"></i><i class="fas fa-oil-can"></i><i class="fas fa-microchip"></i><i class="fas fa-robot"></i><i class="fas fa-ship"></i></div><div class="core-pulse"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span class="core-pulse-text">Diplomatic</span></div></div><div style="font-size:13px;line-height:1.6;color:var(--text-secondary);margin-top:8px;">Monday Aug 3 — Trump halts weekend Iran strikes. Talks to resume Monday. Iran speaking to Oman on Hormuz bypass. Brent $87.93 (-1.24%) · WTI ~$80.80 (-4.6%) · NVDA $198.98. Saudi Red Sea coalition at 14 nations. SPR 307.7M bbl — lowest since 1983. Oil tanker traffic rising through Hormuz on diplomatic hopes.</div>',modal:{title:"CORE SYSTEM",body:"<p><strong>Monday Aug 3</strong> — Trump called off planned weekend strikes on Iran and says negotiations with Tehran will resume Monday. Iran says it isn't currently talking to the US but is speaking to Oman about establishing a new Strait of Hormuz shipping route. Oil prices dropped on hopes for a diplomatic resolution, with tanker traffic increasing through Hormuz.</p><p>Saudi Arabia's 14-nation Multinational Maritime Defense Coalition continues forming to protect Red Sea and Bab el-Mandeb shipping — Pakistan, Turkey, and Egypt committing naval forces.</p><p><strong>Oil:</strong> Brent $87.93 (-1.24%) · WTI ~$80.80 (-4.6%)</p><p><strong>NVDA:</strong> $198.98 (−0.88%). Range $194.95-$201.97. Earnings Aug 26. Alibaba funnels 20K Nvidia chips for Kimi K3.</p><p><strong>SPR:</strong> 307.7M bbl — lowest since 1983. GAO reports 25% of inventory unavailable for drawdown.</p>"}},{g:"box-iran",id:"iran",icon:"fa-explosion",title:"IRAN CONFLICT",content:'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;"><span class="tag" style="background:var(--alert-green);color:#1a1815;">TALKS MONDAY</span><span class="tag" style="background:var(--alert-yellow);color:#1a1815;">STRIKES HALTED</span></div><div class="stat-row"><span class="stat-label">US Strikes</span><span class="stat-value">Halted by Trump</span></div><div class="stat-row"><span class="stat-label">Negotiations</span><span class="stat-value">Resume Monday</span></div><div class="stat-row"><span class="stat-label">Iran-Oman</span><span class="stat-value">Hormuz bypass talks</span></div><div class="stat-row"><span class="stat-label">Saudi Coalition</span><span class="stat-value">14 nations</span></div><div class="stat-row"><span class="stat-label">Tanker Traffic</span><span class="stat-value">Rising through Hormuz</span></div>',modal:{title:"IRAN CONFLICT",body:"<p>Trump halts weekend strikes — negotiations with Iran to begin Monday. Iran speaking to Oman (not US directly) about establishing a bypass route through the Strait of Hormuz. Saudi Arabia's 14-nation Multinational Maritime Defense Coalition for Red Sea/Bab el-Mandeb. Oil tanker traffic increasing on diplomatic hopes. Previous heavy strikes by CENTCOM hit dozens of IRGC targets in late July.</p>"}},{g:"box-brent",id:"brent",icon:"fa-oil-can",title:"BRENT CRUDE",content:'<div class="big-number green">$87.93</div><div class="label-sm">Brent / bbl</div><div style="margin-top:6px;"><span class="change-down" style="font-family:\'Anton\',sans-serif;font-size:22px;">-1.24%</span></div><div style="margin-top:auto;padding-top:8px;"><div class="stat-row"><span class="stat-label">Prev Close</span><span class="stat-value">$89.03</span></div><div class="stat-row"><span class="stat-label">Weekly High</span><span class="stat-value">$102</span></div><div class="stat-row"><span class="stat-label">52-wk High</span><span class="stat-value">$126.41</span></div></div>',modal:{title:"BRENT",body:"<p>Brent $87.93 (-1.24%) — Down on diplomatic hopes after Trump halts weekend strikes. Prev close $89.03. Weekly high $102. 52-week range $58.72-$126.41. Hormuz risk premium compressing as tanker traffic resumes. EIA forecasts Brent avg $74 in 3Q26.</p>"}},{g:"box-wti",id:"wti",icon:"fa-gas-pump",title:"WTI CRUDE",content:'<div class="big-number green">$80.80</div><div class="label-sm">WTI / bbl</div><div style="margin-top:6px;"><span class="change-down" style="font-family:\'Anton\',sans-serif;font-size:22px;">-4.57%</span></div><div style="margin-top:auto;padding-top:8px;"><div class="stat-row"><span class="stat-label">Prev Close</span><span class="stat-value">$84.67</span></div><div class="stat-row"><span class="stat-label">Range Today</span><span class="stat-value">$78.83-$81.30</span></div><div class="stat-row"><span class="stat-label">Retail Gas</span><span class="stat-value">~$3.95</span></div></div>',modal:{title:"WTI",body:"<p>WTI ~$80.80 (-4.57%) — Sharp sell-off as markets aggressively unwind the geopolitical risk premium. Prev close $84.67. Intraday range $78.83-$81.30. 52-week high $119.47 (Mar 2026), low $54.97 (Dec 2025). Retail gas ~$3.95/gal. Iran war underpins supply fears but diplomatic resolution hopes cap prices.</p>"}},{g:"box-nvda",id:"nvda",icon:"fa-microchip",title:"NVDA",content:'<div class="big-number green">$198.98</div><div class="label-sm">NASDAQ</div><div style="margin-top:6px;"><span class="change-down" style="font-family:\'Anton\',sans-serif;font-size:22px;">-0.88%</span></div><div style="margin-top:auto;padding-top:8px;"><div class="stat-row"><span class="stat-label">Day Range</span><span class="stat-value">$194.95-$201.97</span></div><div class="stat-row"><span class="stat-label">Consensus PT</span><span class="stat-value change-up">$302 (+52%)</span></div></div>',modal:{title:"NVDA",body:"<p>NVDA $198.98 (−0.88%). Aug 3 range $194.95-$201.97. Market cap $4.86T, P/E 30.74. Nvidia reported Q2 FY27 revenue $81.6B (Data Center booming). Alibaba secretly funneled 20,000 Nvidia chips to power Kimi K3 despite US export crackdown. Goldman: 21.7x forward PE 'compelling'. 61 analysts rate Strong Buy. Next earnings: Aug 26, 2026. FY26 revenue $215.94B (+65.47%).</p>"}},{g:"box-macros",id:"macros",icon:"fa-chart-line",title:"DAILY MACROS",content:'<div class="macro-grid"><div class="macro-item"><div class="macro-value green">203</div><div class="macro-label">Protein</div></div><div class="macro-item"><div class="macro-value yellow">87</div><div class="macro-label">Carbs</div></div><div class="macro-item"><div class="macro-value yellow">62</div><div class="macro-label">Fat</div></div><div class="macro-item"><div class="macro-value green">1,847</div><div class="macro-label">Cals</div></div></div>',modal:{title:"MACROS",body:"<p>Protein 203g · Carbs 87g · Fat 62g · Calories 1,847</p>"}},{g:"box-gym",id:"gym",icon:"fa-dumbbell",title:"BRUTE LOG",content:'<div class="gym-section"><span class="tag" style="background:var(--alert-green);color:#1a1815;">PUSH DAY</span></div><div class="gym-exercise"><span class="gym-name">Bench Press</span><span class="gym-done">4x8</span></div><div class="gym-exercise"><span class="gym-name">OHP</span><span class="gym-done">4x10</span></div><div class="gym-exercise"><span class="gym-name">Lat Raise</span><span class="gym-done">3x15</span></div><div class="gym-header">NEXT: PULL DAY</div>',modal:{title:"GYM",body:"<p>Push Day done. Bench 4x8 · OHP 4x10 · Lat Raise 3x15</p>"}},{g:"box-spr",id:"spr",icon:"fa-oil-can",title:"SPR ALERT",content:'<div class="big-number yellow">307.70M</div><div class="label-sm">Strategic Petroleum Reserve</div><div class="spr-bar-bg"><div class="spr-bar-fill" style="width:43.1%;"></div></div><div style="margin-top:4px;font-size:10px;color:var(--alert-red);letter-spacing:1px;text-transform:uppercase;">1983 low · GAO: 25% unavailable · Drawdown -5.5M wk</div>',modal:{title:"SPR",body:"<p><strong>US SPR:</strong> 307.7M bbl — lowest since March 1983 (43.1% of 714M cap). GAO warns 25% of inventory unavailable for drawdown due to infrastructure outages. Weekly drawdown: -5.5M bbl. 172M bbl released in 2026 for Iran war emergency. Congress-directed sales total ~170M bbl with ~90M more planned.</p><p><strong>China:</strong> ~1,400M bbl strategic reserve</p><p><strong>Japan:</strong> ~263M bbl (188 days of imports)</p>"}},{g:"box-news-iran",id:"iran-news",icon:"fa-newspaper",title:"IRAN NEWS",content:'<div class="news-list" id="iranNewsList"></div>',modal:{title:"NEWS",body:"<p>Iran & Energy News Feed</p>"}},{g:"box-news-nvda",id:"nvda-news",icon:"fa-chart-bar",title:"AI &amp; NVDA NEWS",content:'<div class="news-list" id="nvdaNewsList"></div>',modal:{title:"NVDA NEWS",body:"<p>AI & NVDA News Feed</p>"}}];
blocks.forEach((b,i)=>{const d=document.createElement('div');d.className='block'+(b.g?' '+b.g:'');d.dataset.index=i;d.innerHTML='<div class="block-title"><i class="fas '+b.icon+'"></i> '+b.title+'</div><div class="block-content">'+b.content+'</div><div class="last-updated">'+UPDATED_STR+' BRT</div>';d.addEventListener('click',()=>openModal(b.modal.title,b.modal.body,b.id));document.getElementById('dgrid').appendChild(d);});
function renderNews(id,items,n){const e=document.getElementById(id);if(!e)return;e.innerHTML='';items.slice(0,n||5).forEach(i=>{const d=document.createElement('div');d.className='news-item';d.innerHTML='<div class="news-title">'+i.title+'</div><div class="news-meta">'+(i.date||i.src||'')+'</div>';e.appendChild(d);});}
renderNews('iranNewsList',newsData,5);renderNews('nvdaNewsList',nvdaNews,5);
function openModal(t,b,s){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').classList.add('active');document.body.style.overflow='hidden';}
function closeModal(){document.getElementById('modal').classList.remove('active');document.body.style.overflow='';}
document.getElementById('modal').addEventListener('click',(e)=>{if(e.target===document.getElementById('modal'))closeModal();});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape')closeModal();});
</script>
</body>
</html>
