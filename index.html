<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IronClaw Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#e8e0d5;--card:#ddd5c8;--card-hover:#d5cdbf;--text:#2c2820;--text2:#6b6559;--acc:#9e8f7a;--red:#c0392b;--green:#27ae60;--yel:#d4a017;--tbg:#d5cdbf;--mover:rgba(44,40,32,.7)}
.dark{--bg:#1a1815;--card:#25221e;--card-hover:#2f2b26;--text:#e8e0d5;--text2:#9e9487;--acc:#7a6f60;--tbg:#2f2b26;--mover:rgba(0,0,0,.7)}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);padding:4px;min-height:100vh;transition:background .3s,color .3s}
.ant{font-family:Anton,sans-serif;letter-spacing:.5px}
.wr{max-width:1440px;margin:0 auto}
.gr{display:grid;gap:6px}
@media(min-width:641px){.gr{grid-template-columns:repeat(6,1fr);grid-auto-rows:auto}.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.r2{grid-row:span 2}}
@media(max-width:640px){body{padding:3px}.gr{grid-template-columns:1fr;gap:4px}}
.b{background:var(--card);padding:10px;cursor:pointer;transition:background .2s,transform .12s;position:relative;display:flex;flex-direction:column;overflow:hidden}
.b:hover{background:var(--card-hover)}
.b:active{transform:scale(.98)}
.bt{font-family:Anton,sans-serif;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.bt i{color:var(--acc);width:12px}
.bc{flex:1;display:flex;flex-direction:column}
.bn{font-family:Anton,sans-serif;font-size:30px;line-height:1;letter-spacing:.5px}
.bng{color:var(--green)}.bnr{color:var(--red)}.bny{color:var(--yel)}
.ls{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-top:2px}
.ta{display:inline-block;font-size:7px;letter-spacing:1.5px;text-transform:uppercase;background:var(--tbg);padding:2px 5px;color:var(--text2)}
.cu{color:var(--green)}.cd{color:var(--red)}
.sr{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--acc);opacity:.45;font-size:10px}
.sr:last-child{border:none}
.sl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2)}
.sv{font-family:Anton,sans-serif;font-size:13px}
.nl{flex:1;overflow-y:auto;max-height:160px}
.ni{padding:4px 0;border-bottom:1px solid var(--acc);opacity:.45;font-size:10px;line-height:1.3;cursor:pointer}
.ni:last-child{border:none}
.nm{font-size:7px;letter-spacing:1px;text-transform:uppercase;color:var(--text2);margin-top:1px}
.sb{width:100%;height:8px;background:var(--tbg);margin-top:4px;overflow:hidden;border-radius:3px}
.sf{height:100%;background:var(--yel);border-radius:3px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:3px}
.mi{text-align:center;padding:4px;background:var(--tbg)}
.mv{font-family:Anton,sans-serif;font-size:22px;line-height:1}
.ml{font-size:7px;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-top:1px}
.ge{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--acc);opacity:.45;font-size:10px}
.ge:last-child{border:none}
.gh{font-family:Anton,sans-serif;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--yel);margin:3px 0 1px 0}
.ca{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px}
.ci{position:relative;width:40px;height:40px}
.ci i{position:absolute;font-size:12px;color:var(--acc)}
.ci i:nth-child(1){top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px}
.ci i:nth-child(2){top:0;left:50%;transform:translateX(-50%)}
.ci i:nth-child(3){top:50%;right:0;transform:translateY(-50%)}
.ci i:nth-child(4){bottom:0;left:50%;transform:translateX(-50%)}
.ci i:nth-child(5){top:50%;left:0;transform:translateY(-50%)}
.cpd{display:flex;gap:3px;align-items:center}
.cpd .dt{width:4px;height:4px;background:var(--green);border-radius:50%}
.cpt{font-family:Anton,sans-serif;font-size:7px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text2);margin-left:5px}
.lu{position:absolute;bottom:3px;right:6px;font-size:6px;letter-spacing:1px;text-transform:uppercase;color:var(--text2);opacity:0;transition:opacity .2s}
.b:hover .lu{opacity:.6}
.ovr{position:fixed;inset:0;z-index:1000;background:var(--mover);display:none;overflow-y:auto}
.ovr.active{display:block}
.mcw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6px}
.mcb{background:var(--card);width:100%;min-height:90vh;padding:24px 16px;position:relative}
.mcb .mct{font-family:Anton,sans-serif;font-size:20px;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;text-align:center}
.mcb p{font-size:14px;line-height:1.6;margin-bottom:10px;color:var(--text2)}
.mx{position:absolute;top:8px;right:10px;font-size:24px;cursor:pointer;color:var(--text2);border:none;background:none;font-family:inherit;line-height:1}
.mx:hover{color:var(--text)}
</style>
</head>
<body>
<div class="wr"><div class="gr" id="grd"></div></div>
<div class="ovr" id="mdl"><div class="mcw"><div class="mcb"><button class="mx" id="mcl">&times;</button><div class="mct" id="mtt"></div><div id="mbb"></div></div></div></div>
<script>

{t:"Analysts Consensus: Strong Buy, PT $302 (+52%)",s:"Public.com",b:"37 analysts rate Strong Buy. Goldman: 21.7x forward PE 'compelling' after recent pullback."},

var bl=[
{g:"c4 r2",ic:"microchip",ti:"CORE SYSTEM",
 c:'<div class="ca"><div class="ci"><i class="fas fa-shield-halved"></i><i class="fas fa-oil-can"></i><i class="fas fa-microchip"></i><i class="fas fa-robot"></i><i class="fas fa-ship"></i></div><div class="cpd"><div class="dt"></div><div class="dt"></div><div class="dt"></div><span class="cpt">Diplomatic</span></div></div><div style="font-size:11px;line-height:1.5;color:var(--text2)">Mon Aug 3 — Trump halts strikes. Talks Monday. Iran-Oman Hormuz bypass. Brent $87.93 (-1.24%) · WTI ~$80.80 (-4.6%) · NVDA $198.98. Saudi Red Sea coalition (14 nations). SPR 307.7M bbl.</div>',
 m:"<p><strong>Monday Aug 3</strong> — Trump called off planned weekend strikes, negotiations with Tehran resume Monday. Iran talking to Oman about Hormuz bypass route. Oil tanker traffic increasing on diplomatic hopes.</p><p><strong>Oil:</strong> Brent $87.93 (-1.24%) · WTI ~$80.80 (-4.6%)</p><p><strong>NVDA:</strong> $198.98 (−0.88%). Market cap $4.86T. Earnings Aug 26. Alibaba funneled 20K Nvidia chips for Kimi K3.</p><p><strong>SPR:</strong> 307.7M bbl — 1983 low. GAO: 25% unavailable for drawdown.</p>"},
{g:"c2 r2",ic:"explosion",ti:"IRAN CONFLICT",
 c:'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px"><span class="ta" style="background:var(--green);color:#1a1815">TALKS MONDAY</span><span class="ta" style="background:var(--yel);color:#1a1815">STRIKES HALTED</span></div><div class="sr"><span class="sl">US Strikes</span><span class="sv">Halted by Trump</span></div><div class="sr"><span class="sl">Negotiations</span><span class="sv">Resume Mon</span></div><div class="sr"><span class="sl">Iran-Oman</span><span class="sv">Hormuz bypass</span></div><div class="sr"><span class="sl">Saudi Coalition</span><span class="sv">14 nations</span></div><div class="sr"><span class="sl">Tanker Traffic</span><span class="sv">Rising</span></div>',
 m:"<p>Trump halts weekend strikes; negotiations with Iran to begin Monday. Iran speaking to Oman (not US directly) about a Hormuz bypass. Saudi 14-nation coalition for Red Sea. Tanker traffic increasing.</p><p>Previous CENTCOM strikes hit dozens of IRGC targets in late July.</p>"},
{g:"c2",ic:"oil-can",ti:"OIL (BRENT + WTI)",
 c:'<div style="display:flex;gap:10px;align-items:flex-start"><div><div class="bn bng">$87.93</div><div class="ls">Brent</div><div><span class="ant cd" style="font-size:14px">-1.24%</span></div></div><div><div class="bn bng">$80.80</div><div class="ls">WTI</div><div><span class="ant cd" style="font-size:14px">-4.57%</span></div></div></div><div style="margin-top:auto;padding-top:6px"><div class="sr"><span class="sl">Brent Prev</span><span class="sv">$89.03</span></div><div class="sr"><span class="sl">WTI Prev</span><span class="sv">$84.67</span></div><div class="sr"><span class="sl">Tanker Traffic</span><span class="sv">Rising via Hormuz</span></div></div>',

{g:"c2",ic:"fire",ti:"NATURAL GAS",

 m:"<p><strong>Natural Gas (Henry Hub): $2.85/MMBtu (+1.1%)</strong></p><p>Summer cooling demand supports. Storage injection of +35 Bcf in line. Prices well below 52-wk high of $4.20. Minimal direct impact from Middle East tensions relative to crude.</p>"},
{g:"c2",ic:"microchip",ti:"NVDA",
 c:'<div><span class="bn bng">$198.98</span></div><div class="ls">NASDAQ</div><div><span class="ant cd" style="font-size:14px">-0.88%</span></div><div style="margin-top:auto;padding-top:6px"><div class="sr"><span class="sl">Consensus PT</span><span class="sv cu">$302 (+52%)</span></div><div class="sr"><span class="sl">Market Cap</span><span class="sv">$4.86T</span></div></div>',
 m:"<p><strong>NVDA: $198.98 (−0.88%)</strong></p><p>Aug 3 range $194.95-$201.97. Market cap $4.86T. P/E 30.74. Q2 FY27 revenue $81.6B. 61 analysts: Strong Buy. Goldman: 21.7x forward PE 'compelling'. Alibaba secretly funneled 20K Nvidia chips for Kimi K3 despite US export crackdown. Next earnings: Aug 26, 2026.</p>"},
{g:"c2",ic:"chart-line",ti:"DAILY MACROS",
 c:'<div class="mg"><div class="mi"><div class="mv cu">144</div><div class="ml">Protein</div></div><div class="mi"><div class="mv" style="color:var(--text)">172</div><div class="ml">Carbs</div></div><div class="mi"><div class="mv" style="color:var(--yel)">115</div><div class="ml">Fats</div></div><div class="mi"><div class="mv" style="color:var(--text)">2.3k</div><div class="ml">Calories</div></div></div><div style="display:flex;justify-content:center;gap:8px;margin-top:2px"><span class="ant" style="font-size:7px;color:var(--green)">P:25%</span><span class="ant" style="font-size:7px;color:var(--text2)">C:30%</span><span class="ant" style="font-size:7px;color:var(--yel)">F:45%</span></div>',
 m:"<p><strong>Daily Macros (90kg — 2,300 kcal target)</strong></p><p><strong>Protein:</strong> 144g (576 kcal) at 1.6g/kg<br><strong>Carbs:</strong> 172g (690 kcal — 30%)<br><strong>Fats:</strong> 115g (1,034 kcal — 45%)<br><strong>Total:</strong> 2,300 kcal</p>"},

function rn(id,items){var e=document.getElementById(id);if(!e)return;e.innerHTML='';for(var i=0;i<items.length;i++){var it=items[i];var d=document.createElement('div');d.className='ni';var dt=document.createElement('div');dt.className='nm';dt.textContent=it.d||it.s||'';d.appendChild(dt);d.onclick=(function(it){return function(){event.stopPropagation();document.getElementById('mtt').textContent=it.t;document.getElementById('mbb').innerHTML='<p><strong>'+it.t+'</strong></p><p>'+it.b+'</p><p style=\"font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text2)\">'+(it.d||it.s||'')+'</p>';document.getElementById('mdl').classList.add('active');document.body.style.overflow='hidden'}})(it);var ti=document.createElement('div');ti.textContent=it.t;d.insertBefore(ti,d.firstChild);e.appendChild(d)}}
rn('ln1',nd);rn('ln2',n2);

for(var i=0;i<bl.length;i++){

  d.className='b '+(o.g||'');
  d.innerHTML='<div class="bt"><i class="fas fa-'+o.ic+'"></i>'+o.ti+'</div><div class="bc">'+o.c+'</div><div class="lu">'+ts+' BRT</div>';
  d.onclick=(function(o){return function(){document.getElementById('mtt').textContent=o.ti;document.getElementById('mbb').innerHTML=o.m;document.getElementById('mdl').classList.add('active');document.body.style.overflow='hidden'}})(o);
  g.appendChild(d);
}
document.getElementById('mcl').onclick=function(){document.getElementById('mdl').classList.remove('active');document.body.style.overflow=''};
document.getElementById('mdl').onclick=function(e){if(e.target===this){this.classList.remove('active');document.body.style.overflow=''}};
document.onkeydown=function(e){if(e.key==='Escape'){document.getElementById('mdl').classList.remove('active');document.body.style.overflow=''}};
</script>

</html>
