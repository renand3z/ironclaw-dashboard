<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IronClaw Dashboard · Aug 11</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e0d5;--card:#ddd5c8;--card-h:#d5cdbf;--tx:#2c2820;--tx2:#6b6559;--green:#27ae60;--red:#c0392b;--yel:#d4a017;--ov:rgba(44,40,32,.7)}
body.dark{--bg:#1a1815;--card:#25221e;--card-h:#2f2b26;--tx:#e8e0d5;--tx2:#9e9487;--ov:rgba(0,0,0,.7)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);padding:16px}
h1{font-family:'Anton';letter-spacing:3px;font-size:22px;margin-bottom:16px;text-transform:uppercase}
h1 span{color:var(--tx2)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(6,1fr)}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.c{border:0;background:var(--card);padding:20px;cursor:pointer;text-align:left;font-family:'Inter';color:var(--tx);position:relative;display:flex;flex-direction:column;min-height:130px}
.c:hover{background:var(--card-h)}
.c .t{font-family:'Anton';font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--tx2);margin-bottom:10px}
.c .v{font-family:'Anton';font-size:38px;line-height:1}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--yel)}
.c .l{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--tx2);margin-top:6px}
.c .s{display:flex;justify-content:space-between;font-size:11px;border-top:1px solid var(--card-h);padding-top:6px;margin-top:auto;opacity:.8}
.c .s b{font-weight:700}
.c .n{font-size:12px;line-height:1.45;color:var(--tx2);margin-top:8px;flex:1}
.bar{height:12px;background:var(--card-h);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yel)}
.col6{grid-column:span 4}.col2{grid-column:span 2}.col3{grid-column:span 3}
.modal{display:none;position:fixed;inset:0;background:var(--ov);justify-content:center;align-items:center;padding:20px;z-index:10}
.modal.open{display:flex}
.box{background:var(--card);max-width:640px;width:100%;max-height:80vh;overflow:auto;padding:26px}
.box h2{font-family:'Anton';letter-spacing:2px;margin-bottom:12px}
.box p{font-size:13px;line-height:1.55;color:var(--tx2);margin-bottom:10px}
.box b{color:var(--tx)}
.x{float:right;font-size:20px;background:none;border:none;color:var(--tx2);cursor:pointer}
</style>
</head>
<body>
<div class="wrap"><h1>IronClaw <span>· Aug 11 · Hormuz on Edge</span></h1><div class="grid" id="g"></div></div>
<div class="modal" id="m"><div class="box" id="mb"></div></div>
<script>
(function(){try{var h=new Date().toLocaleString('en-US',{hour:'2-digit',hour12:false,timeZone:'America/Sao_Paulo'});var ha=parseInt(h);if(ha>=18||ha<6)document.body.classList.add('dark')}catch(e){}})();
var D=[
{t:'CORE',c:'col6',v:'Hormuz Deal on Edge',l:'Convoys paused · IMO escorts halted',n:'UN IMO paused Hormuz escorts after a vessel attack; deal on edge. Trump semi-negotiating; Israel rejects Gaza. Brent 87.69, WTI 80.42, NVDA 217.55, SPR 298.7M.',body:'<p><b>Monday Aug 10-11</b> - The fragile Iran deal is on the edge after a vessel attack in the Strait of Hormuz and the UN IMO paused its escort operation (Reuters). Trump says the US is "only semi-negotiating"; Israel rejected the 15-point Gaza document.</p><p><b>Key:</b> Tehran is negotiating only with Oman on a temporary safe route, not directly with Washington (NBC). IRGC says the strait opens only after the US accepts Iranian conditions. The 60-day Omani-mediated arrangement remains unratified.</p><p><b>Oil:</b> Brent $87.69 (+4.95%) jumped as reopen hopes faded - WTI $80.42 (+2.86%).</p><p><b>NVDA:</b> $217.55 (-2.86%) on the $500B AI financing plan. Earnings Aug 26.</p><p><b>SPR:</b> 298.7M bbl - lowest since 1983. GAO warns 25% unavailable.</p>'},
{t:'IRAN',c:'col2',v:'IMO escorts paused',l:'Semi-negotiating',n:'Only via Oman, not US. Houthi attacks ongoing.',body:'<p><b>Mon Aug 10-11</b> - UN IMO paused its Hormuz escort operation after a vessel attack (Reuters). Trump says he is "only semi-negotiating" with Tehran. Israel rejected the 15-point Gaza document.</p><p><b>Status:</b> Iran is discussing a temporary safe route only with Oman - not Washington (NBC). IRGC says the strait opens only after the US accepts Iranian conditions. The 60-day arrangement remains unratified. Houthi attacks persist.</p>'},
{t:'BRENT',c:'col2',v:'$87.69',s:'+4.95%',l:'Brent / bbl',n:'Prev close $83.55; +5.27% mth, +31.61% YoY.',body:'<p><b>Brent ~$87.69 (+4.95%)</b> - Jumped Monday after the UN IMO paused Hormuz escorts following a vessel attack (TradingEconomics/Reuters). Prev close ~$83.55. Up 5.27% over the month, +31.61% YoY. EIA forecasts Brent avg $74 for 3Q26. Risk premium re-expanding; Houthi Red Sea attacks support the floor.</p>'},
{t:'WTI',c:'col2',v:'$80.42',s:'+2.86%',l:'WTI / bbl',n:'Prev close $78.18; +2.91% mth, +25.73% YoY.',body:'<p><b>WTI ~$80.42 (+2.86%)</b> - Rallied Monday as supply fears resurfaced after the suspension of IMO Hormuz convoys. Prev close ~$78.18. Up 2.91% over the month, +25.73% YoY (Trading Economics). Retail gas ~$3.85/gal. Risk premium re-expanding; Houthi Red Sea risks persist.</p>'},
{t:'NVDA',c:'col2',v:'$217.55',s:'-2.86%',l:'NASDAQ',n:'Slid on $500B financing plan; mkt cap $5.35T; earnings Aug 26; PT $304.',body:'<p><b>NVDA $217.55 (-2.86%)</b> - Fell after Nvidia announced partnerships with Apollo, BlackRock, Blackstone, Brookfield, Goldman and KKR to mobilize over $500B for AI infrastructure. Concerns over capital needs pressured shares, briefly erasing ~$130B. Market cap ~$5.35T. FY26 revenue $215.94B (+64.75% YoY). Consensus PT ~$304. Earnings Aug 26.</p>'},
{t:'SPR',c:'col2',v:'298.7M',s:'41.8% cap',l:'Strategic Petroleum Reserve',n:'Lowest since 1983; -6.1M w/w; GAO: 25% unavailable.',body:'<p><b>US SPR:</b> 298.7M bbl, lowest since 1983 (41.8% of 714M cap), weekly drawdown -6.1M bbl as Iran-war pressure drains inventory. GAO warns ~25% unavailable for drawdown. DOE released well over 170M bbl via exchanges since April 2026. Total US crude inventories ~730.8M, lowest since 1984.</p><p><b>China:</b> ~1.3-1.4B bbl strategic inventory (largest in the world).</p><p><b>Japan:</b> ~263M bbl government-held reserves (~188 days import cover).</p>'},
{t:'MACROS',c:'col2',v:'2,109 kcal',s:'P203 - C87 - F62',l:'Daily targets',n:'Protein 203g - Carbs 87g - Fat 62g - Calories 1,847.',body:'<p>Protein 203g - Carbs 87g - Fat 62g - Calories 1,847</p>'},
{t:'GYM',c:'col2',v:'PUSH DONE',s:'B4x8 O4x10 L3x15',l:'Next: Pull day',n:'Bench 4x8 - OHP 4x10 - Lat Raise 3x15.',body:'<p>Push Day done. Bench 4x8 - OHP 4x10 - Lat Raise 3x15</p>'},
{t:'NEWS - IRAN',c:'col3',v:'',l:'Update',n:'',list:["Hormuz convoys paused after attack - UN IMO halts escort as deal hangs (Reuters, Aug 10-11)","Brent ~$87.69 (+4.95%) - oil jumps as reopen hopes fade, IMO escort paused","Trump says US only semi-negotiating with Tehran; Israel rejects Gaza plan","Iran only in talks with Oman over temporary Hormuz safe route - not US (NBC)"],body:'<p>Iran and Energy news feed, Aug 10-11.</p>'},
{t:'NEWS - NVDA',c:'col3',v:'',l:'Update',n:'',list:["NVDA $217.55 (-2.86%) - drops on $500B AI financing plan; range $216.77-$225.00 (Aug 10)","Nvidia, six firms team up to mobilize over $500B for AI infrastructure (Reuters/CNBC)","CEO calls AI data centers investable assets after Wall Street partnership","NVDA market cap sheds ~$130B intraday on financing deal concerns (Forbes)"],body:'<p>AI and NVDA news feed.</p>'}
];
function el(c,html){var d=document.createElement(c);d.innerHTML=html;return d}
var g=document.getElementById('g');
D.forEach(function(o){
 var b=document.createElement('div');b.className='card c '+o.c+'';
 var s='<div class="t">'+o.t+'</div>';
 if(o.v)s+='<div class="v '+(typeof o.s==='string'&&o.s.charAt(0)==='-'?'neg':o.s&&o.s.charAt(0)==='+'?'pos':'')+'">'+o.v+'</div>';
 if(o.s&&o.l)s+='<div class="l">'+o.s+' · '+o.l+'</div>';else if(o.l)s+='<div class="l">'+o.l+'</div>';
 if(o.list){s+='<div style="font-size:12px">';o.list.forEach(function(x){s+='<div style="padding:5px 0;border-bottom:1px solid var(--card-h)">'+x+'</div>'});s+='</div>'}
 else if(o.n)s+='<div class="n">'+o.n+'</div>';
 b.innerHTML=s;
 b.onclick=function(){document.getElementById('mb').innerHTML='<button class="x" onclick="document.getElementById(\'m\').classList.remove(\'open\')">&#10005;</button><h2>'+o.t+'</h2>'+(o.body||'<p>'+o.n+'</p>');document.getElementById('m').classList.add('open')};
 g.appendChild(b);
});
document.getElementById('m').onclick=function(e){if(e.target===this)this.classList.remove('open')};
</script>
</body>
</html>
