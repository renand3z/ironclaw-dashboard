<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #e8e0d5;
    --card: #ddd5c8;
    --card-hover: #d5cdbf;
    --text: #2c2820;
    --text-secondary: #6b6559;
    --accent: #9e8f7a;
    --alert-red: #c0392b;
    --alert-green: #27ae60;
    --alert-yellow: #d4a017;
    --tag-bg: #d5cdbf;
    --modal-overlay: rgba(44,40,32,0.7);
  }

  body.dark {
    --bg: #1a1815;
    --card: #25221e;
    --card-hover: #2f2b26;
    --text: #e8e0d5;
    --text-secondary: #9e9487;
    --accent: #7a6f60;
    --tag-bg: #2f2b26;
    --modal-overlay: rgba(0,0,0,0.7);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    transition: background 0.3s, color 0.3s;
    min-height: 100vh;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .block {
    background: var(--card);
    padding: 24px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 200px;
  }
  .block:hover { background: var(--card-hover); }
  .block:active { transform: scale(0.99); }

  .block-title {
    font-family: 'Anton', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .block-title i {
    color: #9e8f7a;
    width: 18px;
    text-align: center;
  }

  .block-content {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Big number style */
  .big-number {
    font-family: 'Anton', sans-serif;
    font-size: 52px;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .big-number.green { color: var(--alert-green); }
  .big-number.red { color: var(--alert-red); }
  .big-number.yellow { color: var(--alert-yellow); }

  .label-sm {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: var(--tag-bg);
    padding: 3px 8px;
    color: var(--text-secondary);
    margin-top: 6px;
  }

  .change-up { color: var(--alert-green); }
  .change-down { color: var(--alert-red); }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 8px 0;
    border-bottom: 1px solid var(--accent);
    opacity: 0.4;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .stat-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .stat-row .stat-value {
    font-family: 'Anton', sans-serif;
    font-size: 18px;
  }

  .news-list {
    flex: 1;
    overflow-y: auto;
    max-height: 260px;
  }
  .news-list .news-item {
    padding: 8px 0;
    border-bottom: 1px solid var(--accent);
    opacity: 0.4;
  }
  .news-list .news-item:last-child { border-bottom: none; }
  .news-list .news-item .news-title {
    font-size: 13px;
    line-height: 1.3;
    color: var(--text);
  }
  .news-list .news-item .news-meta {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-top: 3px;
  }

  /* SPR bar */
  .spr-bar-bg {
    width: 100%;
    height: 16px;
    background: var(--tag-bg);
    margin-top: 10px;
    overflow: hidden;
  }
  .spr-bar-fill {
    height: 100%;
    background: var(--alert-yellow);
    transition: width 1s ease;
  }

  /* Macros card */
  .macro-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 6px;
  }
  .macro-item {
    text-align: center;
    padding: 8px;
    background: var(--tag-bg);
  }
  .macro-item .macro-value {
    font-family: 'Anton', sans-serif;
    font-size: 32px;
    line-height: 1;
  }
  .macro-item .macro-label {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .macro-total {
    grid-column: 1/-1;
    text-align: center;
    padding: 10px;
    background: var(--tag-bg);
  }
  .macro-total .macro-value {
    font-family: 'Anton', sans-serif;
    font-size: 38px;
    line-height: 1;
  }
  .macro-total .macro-label {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* Gym Log */
  .gym-exercise {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid var(--accent);
    opacity: 0.4;
    font-size: 12px;
    line-height: 1.3;
  }
  .gym-exercise:last-child { border-bottom: none; }
  .gym-exercise .gym-name { color: var(--text); }
  .gym-exercise .gym-done { color: var(--text-secondary); font-family: 'Anton', sans-serif; font-size: 14px; letter-spacing: 1px; }
  .gym-exercise .gym-next { color: var(--alert-green); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .gym-header {
    font-family: 'Anton', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--alert-yellow);
    margin: 6px 0 2px 0;
  }
  .gym-section {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .gym-section .tag {
    font-size: 9px;
    padding: 2px 6px;
  }

  /* Core System animation area */
  .core-animation {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    position: relative;
    min-height: 120px;
  }
  .core-icon-ring {
    position: relative;
    width: 80px;
    height: 80px;
  }
  .core-icon-ring i {
    position: absolute;
    font-size: 20px;
    color: var(--accent);
    animation: orbit 6s linear infinite;
  }
  .core-icon-ring i:nth-child(1) { top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 28px; animation: none; }
  .core-icon-ring i:nth-child(2) { top: 0; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
  .core-icon-ring i:nth-child(3) { top: 50%; right: 0; transform: translateY(-50%); animation-delay: 1.5s; }
  .core-icon-ring i:nth-child(4) { bottom: 0; left: 50%; transform: translateX(-50%); animation-delay: 3s; }
  .core-icon-ring i:nth-child(5) { top: 50%; left: 0; transform: translateY(-50%); animation-delay: 4.5s; }

  @keyframes orbit {
    0% { opacity: 0.2; }
    50% { opacity: 1; }
    100% { opacity: 0.2; }
  }

  .core-pulse {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .core-pulse .dot {
    width: 8px;
    height: 8px;
    background: var(--alert-green);
    border-radius: 50%;
    animation: pulse-dot 1.5s ease-in-out infinite;
  }
  .core-pulse .dot:nth-child(2) { animation-delay: 0.3s; }
  .core-pulse .dot:nth-child(3) { animation-delay: 0.6s; }
  .core-pulse-text {
    font-family: 'Anton', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-left: 8px;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Tooltip - last updated */
  .block .last-updated {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-secondary);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .block:hover .last-updated { opacity: 0.6; }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--modal-overlay);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 40px;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: var(--card);
    padding: 40px;
    max-width: 700px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 24px;
    cursor: pointer;
    color: var(--text-secondary);
    border: none;
    background: none;
    font-family: 'Inter', sans-serif;
  }
  .modal-close:hover { color: var(--text); }
  .modal-content h2 {
    font-family: 'Anton', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .modal-content p {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-secondary);
    margin-bottom: 12px;
  }
  .modal-content a {
    color: var(--text);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .modal-content a:hover { opacity: 0.7; }

  /* Responsive: 1 column on mobile */
  @media (max-width: 1000px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 12px; }
  }
</style>
</head>
